<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Anatomy Atlas</title>
<meta name="theme-color" content="#0a0a0a">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0a0a0a;color:#e8e8e8;font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
  .card{max-width:420px}
  .ic{font-size:52px;margin-bottom:14px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:#a3a3a3;font-size:14.5px;line-height:1.6;margin:0 0 22px}
  button{background:rgba(255,214,10,.13);border:1px solid #3d3d3d;color:#ffd60a;font:inherit;
    font-weight:600;font-size:14px;padding:10px 22px;border-radius:11px;cursor:pointer}
  button:hover{border-color:#ffd60a}
</style>
</head>
<body>
<div class="card">
  <div class="ic">📡</div>
  <h1>You're offline</h1>
  <p>Anatomy Atlas couldn't reach the network. Pages you've already visited — and the 3D body, if you saved it — still work offline.</p>
  <button onclick="location.reload()">Try again</button>
</div>
<script>addEventListener("online",()=>location.reload());</script>
</body>
</html>
