<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas of Human Anatomy</title>
<meta name="description" content="An interactive atlas of the human body: every bone, muscle, organ, nerve and vessel with labeled anatomical diagrams.">
<link rel="preconnect" href="https://upload.wikimedia.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Anatomy Atlas ============ */
:root{
  --font: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", "Consolas", monospace;
}
[data-theme="dark"]{
  --bg:#0a0a0a; --bg2:#111111; --panel:#141414; --panel2:#1a1a1a;
  --text:#e8e8e8; --text2:#a3a3a3; --text3:#777777;
  --border:#2a2a2a; --border2:#3d3d3d;
  --accent:#ffd60a; --accent2:#f2a900; --accent-soft:rgba(255,214,10,.13);
  --hl:rgba(255,214,10,.26);
  --card:#141414; --card-h:#1c1c1c;
  --good:#3ddc84; --warn:#f2a900; --bad:#ff5d6c;
  --shadow:0 8px 28px rgba(0,0,0,.5);
  --side:#0f0f0f;
}
[data-theme="light"]{
  --bg:#ece7d8; --bg2:#e6e0cf; --panel:#fdfbf3; --panel2:#f0ebdf;
  --text:#1a1814; --text2:#4a453a; --text3:#6b6557;
  --border:#ddd5bf; --border2:#cfc5ab;
  --accent:#a07d00; --accent2:#c1910a; --accent-soft:rgba(176,141,10,.12);
  --hl:rgba(176,141,10,.22);
  --card:#fdfbf3; --card-h:#f5efe0;
  --good:#159c63; --warn:#b57e02; --bad:#d92d20;
  --shadow:0 8px 24px rgba(80,65,25,.12);
  --side:#fdfbf3;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15.5px;line-height:1.55}
.hidden{display:none!important}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
#sidebar{position:fixed;top:0;left:0;bottom:0;width:288px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:40}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;color:var(--text)}
.logo:hover{text-decoration:none}
.logo img{width:26px;height:26px;border-radius:6px;display:block}
#theme-toggle{background:var(--panel2);border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px}
#theme-toggle:hover{color:var(--accent);border-color:var(--accent)}
.search-wrap{position:relative;padding:4px 16px 12px}
#search{width:100%;padding:10px 13px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px;outline:none}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-drop{position:absolute;left:16px;right:16px;top:calc(100% - 8px);background:var(--panel);border:1px solid var(--border2);border-radius:12px;box-shadow:var(--shadow);max-height:420px;overflow:auto;z-index:60}
.sd-item{display:flex;gap:10px;align-items:baseline;padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--border)}
.sd-item:last-child{border-bottom:none}
.sd-item:hover,.sd-item.sel{background:var(--accent-soft)}
.sd-item .n{font-weight:600}
.sd-item .s{margin-left:auto;font-size:11px;color:var(--text3);white-space:nowrap}
.sd-all{display:block;text-align:center;padding:9px;font-size:13px;color:var(--accent);cursor:pointer}
.sd-all:hover{background:var(--accent-soft)}
#nav{flex:1;overflow-y:auto;padding:4px 8px 16px}
.nav-sec{margin-top:14px}
.nav-sec h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);padding:0 10px 6px}
.nav-sec-h{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--text3);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:0 10px 6px;cursor:pointer;font-family:inherit;font-weight:600}
.nav-sec-h:hover{color:var(--text)}
.nav-sec-h .chev{display:inline-block;transition:transform .15s;font-size:15px;line-height:1;font-weight:400}
.nav-sec-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.nav-sec-h .ct{margin-left:auto;font-size:11px;color:var(--text3);background:var(--panel2);padding:1px 7px;border-radius:20px}
.nav-coll{max-height:1400px;overflow:hidden;transition:max-height .22s ease}
.nav-coll.closed{max-height:0}
.nav-link{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;color:var(--text2);font-size:14px;cursor:pointer}
.nav-link:hover{background:var(--accent-soft);color:var(--text);text-decoration:none}
.nav-link.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-link .ic{width:20px;text-align:center;flex:none}
.nav-link .ct{margin-left:auto;font-size:11px;color:var(--text3);background:var(--panel2);padding:1px 7px;border-radius:20px}
.nav-link .ct:empty{display:none}
.nav-link .ct.due{background:#f2a90026;color:#f2a900;font-weight:700}
.side-foot{padding:12px 16px;font-size:11px;color:var(--text3);border-top:1px solid var(--border);line-height:1.5}

/* ---------- main ---------- */
#main{flex:1;margin-left:288px;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:10px 26px;display:flex;align-items:center;gap:14px}
#menu-btn{display:none;background:none;border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:18px;padding:4px 10px;cursor:pointer}
.tb-stats{margin-left:auto;display:flex;gap:8px;align-items:center}
.tb-stats:empty{display:none}
.tb-stats .xpbadge,.tb-stats .streakb{padding:4px 11px;font-size:12px}
#crumbs{font-size:13.5px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#crumbs a{color:var(--text2)}
#view{padding:26px 30px 60px;max-width:1180px;width:100%;margin:0 auto}

/* ---------- home ---------- */
.hero{position:relative;border-radius:20px;overflow:hidden;background:radial-gradient(120% 100% at 100% 0%, #3A3022 0%, transparent 55%),linear-gradient(160deg,#2D2921,#201E19);color:#fbf9f3;padding:44px 42px;margin-bottom:26px;box-shadow:var(--shadow)}
[data-theme="light"] .hero{background:linear-gradient(120deg,#0d2b45,#123a5c 45%,#0f5a74);color:#fbf9f3}
.hero h1{font-size:34px;line-height:1.15;margin-bottom:10px;letter-spacing:-.02em}
.hero p{max-width:620px;color:#c9c2b0;font-size:15.5px}
.hero .hero-actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.hero .fig{position:absolute;right:26px;top:50%;transform:translateY(-50%);opacity:.9;display:none}
@media(min-width:980px){.hero .fig{display:block}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:11px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fbf9f3;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.2);text-decoration:none}
.btn.plain{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
.btn.plain:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#141414}
.btn.primary:hover{filter:brightness(1.1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.stat .v{font-size:26px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
.stat .k{font-size:12.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.sec-title{font-size:19px;font-weight:700;margin:28px 0 14px;display:flex;align-items:center;gap:10px}
.sec-title .more{margin-left:auto;font-size:13px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.grid.tight{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-2px);border-color:var(--accent);background:var(--card-h);text-decoration:none}
.card .ch{display:flex;align-items:flex-start;gap:10px}
.card .thumb{width:52px;height:52px;flex:none;border-radius:10px;background:var(--panel2);border:1px solid var(--border);object-fit:cover}
.card .thumb.big{width:64px;height:64px}
.card h3{font-size:15.5px;font-weight:650;line-height:1.25}
.card .aka{font-size:12px;color:var(--text3);font-style:italic}
.card p{font-size:13px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:20px;background:var(--panel2);color:var(--text2);border:1px solid var(--border)}
svg.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,#888);vertical-align:-1px;margin-right:2px}
.badge.sys{color:var(--badge-c,#ffd60a);border-color:color-mix(in srgb,var(--badge-c,#ffd60a) 40%,transparent);background:color-mix(in srgb,var(--badge-c,#ffd60a) 10%,transparent)}
.sys-card{position:relative;overflow:hidden}
.sys-card .ic{font-size:26px}
.sys-card h3{font-size:16px}
.sys-card .bar{height:3px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:4px}
.sys-card .bar i{display:block;height:100%;background:var(--c,#4cc9f0)}
.sys-card::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--c,#4cc9f0) 9%,transparent),transparent 55%);pointer-events:none}

/* ---------- home (overview) ---------- */
.home-head{margin-bottom:18px}
.home-head h1{font-size:32px;line-height:1.12;letter-spacing:-.02em;margin-bottom:6px}
.home-head p{color:var(--text2);max-width:560px}
.home-head .btn{margin-top:12px;background:var(--panel2);border:1px solid var(--border);color:var(--text)}
.home-head .btn:hover{border-color:var(--accent);color:var(--accent)}
.menu-hint{display:none;margin-top:12px;background:var(--panel2);border:1px solid var(--border);color:var(--text2);border-radius:11px;padding:9px 14px;font:600 13px var(--font);cursor:pointer}
.menu-hint:hover{border-color:var(--accent);color:var(--accent)}
.main3d{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr;align-items:center;border-radius:22px;padding:24px 30px;border:1px solid var(--accent);box-shadow:var(--shadow);background:radial-gradient(110% 130% at 0% 0%,var(--accent-soft),transparent 60%),var(--panel)}
.m3d-poster{position:absolute;top:0;right:0;bottom:0;width:min(46%,380px);display:flex}
.m3d-poster img{display:block;height:100%;width:100%;object-fit:cover;object-position:50% 0;opacity:.38;-webkit-mask-image:linear-gradient(to right,transparent,#000 55%);mask-image:linear-gradient(to right,transparent,#000 55%)}
.main3d.noimg .m3d-poster{display:none}
.m3d-body{position:relative;z-index:1}
.m3d-body .kick{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.m3d-body h2{font-size:30px;line-height:1.12;letter-spacing:-.02em;margin:4px 0 8px}
.m3d-body p{color:var(--text2);max-width:460px}
.m3d-body .btn.big{margin-top:16px;padding:14px 24px;font-size:16px;border-radius:13px;background:var(--accent);border-color:var(--accent);color:#141414}
.m3d-body .btn.big:hover{filter:brightness(1.1);color:#141414}
.m3d-chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.m3d-chips .lbl{font-size:12.5px;color:var(--text3);margin-right:2px}
.m3d-chips a{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;border:1px solid color-mix(in srgb,var(--chip-c,var(--border)) 50%,var(--border));background:var(--panel2);color:var(--text);font-size:13px;font-weight:600}
.m3d-chips a:hover{border-color:var(--chip-c,var(--accent));color:var(--chip-c,var(--accent));text-decoration:none}
.m3d-chips a.resume{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.m3d-chips a.resume:hover{color:var(--accent);filter:brightness(1.1)}
.m3d-poster img{animation:heroFloat 7s ease-in-out infinite}
.m3d-poster:hover img{opacity:.48}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){.m3d-poster img{animation:none}}
.hstats{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 2px}
.hstats span{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 13px;font:600 12.5px var(--font);color:var(--text2)}
.hstats b{color:var(--text)}
.sec-title .more{color:var(--accent);text-decoration:none;font-weight:600}
.sec-title .more:hover{text-decoration:underline}
.path2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:14px}
.pcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;color:var(--text);transition:border-color .12s,transform .12s}
.pcard:hover{border-color:var(--accent);transform:translateY(-2px);text-decoration:none}
.pcard .ic{font-size:32px;flex:none}
.pcard .tx{min-width:0;flex:1}
.pcard b{display:block;font-size:18px}
.pcard small{display:block;font-size:13.5px;color:var(--text2);margin-top:2px}
.pcard .go{flex:none;font-size:22px;color:var(--text3)}
.pcard .meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pcard .pbar{display:block;height:5px;background:var(--border);border-radius:5px;overflow:hidden;margin-top:9px}
.pcard .pbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.pcard .pbar-t{display:block;font-size:11px;color:var(--text3);margin-top:5px}
.s3d-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.mini-card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:10px 12px;color:var(--text);transition:border-color .12s}
.mini-card:hover{border-color:var(--accent);text-decoration:none}
.mini-card .thumb{width:44px;height:44px;flex:none;border-radius:9px;background:var(--panel2);border:1px solid var(--border);object-fit:cover;display:flex;align-items:center;justify-content:center}
.mc-t b{display:block;font-size:14px}
.mc-t small{font-size:11.5px;color:var(--accent)}
.sod{display:flex;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.sod-img{flex:none;width:120px;height:120px;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.sod-img .sod-thumb{width:100%;height:100%;object-fit:cover}
.sod-img .ph{font-size:40px}
.sod-body{min-width:0}
.sod .kick{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.sod h3{font-size:19px;margin:3px 0 4px}
.sod h3 a{color:var(--text)}
.sod h3 a:hover{color:var(--accent);text-decoration:none}
.sod p{font-size:13.5px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.sod-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.home-head a:focus-visible,.main3d a:focus-visible,.pcard:focus-visible,.mini-card:focus-visible,.sod a:focus-visible,.menu-hint:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:960px){
  .home-head h1{font-size:26px}
  .menu-hint{display:inline-block}
  .main3d{grid-template-columns:1fr;padding:20px;gap:18px}
  .m3d-poster{width:60%;right:-10%}
  .m3d-poster img{opacity:.18}
  .m3d-body h2{font-size:25px}
  .path2{grid-template-columns:1fr}
}
@media(max-width:520px){.sod{flex-direction:column}.sod-img{width:100%;height:150px}.m3d-body .btn.big{width:100%;justify-content:center}}

/* ---------- list view ---------- */
.list-head{margin-bottom:20px}
.list-head h1{font-size:27px;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.list-head .ic{font-size:30px}
.list-head p{color:var(--text2);margin-top:6px;max-width:760px}
.subchips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.subchip{font-size:12.5px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--panel2);color:var(--text2);cursor:pointer}
.subchip:hover,.subchip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- detail ---------- */
.detail-head{display:flex;gap:24px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap}
.dh-main{flex:1;min-width:260px}
.detail-head h1{font-size:32px;letter-spacing:-.02em;line-height:1.1}
.detail-head .aka{color:var(--text3);font-style:italic;margin-top:4px;font-size:15px}
.detail-head .badges{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.plate{width:300px;max-width:100%;flex:none}
.plate .frame{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;min-height:200px}
.schematic{overflow-x:auto;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:10px 8px 8px;margin-top:8px}
.schematic svg{min-width:640px;width:100%;height:auto;display:block}
.schematic .sc-cap{font-size:11px;color:var(--text3);padding:6px 6px 0}
.schematic a rect{transition:fill .15s}
.schematic a:hover rect{fill:var(--card-h)}
.schematic .on rect{stroke-width:3}
.article{max-width:78ch;line-height:1.75;color:var(--text)}
.article .a-lead{font-size:17px;color:var(--text2);border-left:3px solid var(--accent);padding-left:14px;margin-bottom:22px}
.article h2{font-size:19px;margin:26px 0 10px;color:var(--text)}
.article p{margin:0 0 14px;color:var(--text2)}
.article .a-clin{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:10px;padding:12px 14px;margin:12px 0}
.article .a-clin b{display:block;margin-bottom:6px;color:var(--text)}
.article .a-clin p{margin:0}
.article .a-pearls{list-style:none;padding:0;margin:0 0 8px}
.article .a-pearls li{padding:8px 0 8px 28px;position:relative;color:var(--text2)}
.article .a-pearls li svg,.article .a-pearls li i{position:absolute;left:0;top:10px;color:var(--good)}
.article .a-fig{max-width:560px;margin:18px auto 8px}
.article .a-fig img{width:100%;display:block;border:1px solid var(--border);border-radius:14px;background:#fff;cursor:zoom-in}
.article .a-fig figcaption{font-size:11px;color:var(--text3);text-align:center;padding-top:6px}
.article .a-src{margin-top:28px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.article .a-src h2{font-size:14px;margin:0 0 8px;text-transform:uppercase;letter-spacing:1px;color:var(--text3)}
.article .a-src ul{margin:0;padding-left:18px;font-size:13px;color:var(--text3)}
.article .a-src li{margin-bottom:4px}
.plate img{display:block;width:100%;height:auto;cursor:zoom-in}
.plate .cap{font-size:11.5px;color:var(--text3);margin-top:8px;line-height:1.45}
.plate .cap a{color:var(--text3);text-decoration:underline}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs .th{width:54px;height:54px;object-fit:cover;border-radius:8px;border:2px solid var(--border);cursor:pointer;opacity:.7;background:#fff}
.thumbs .th:hover{opacity:1}
.thumbs .th.on{opacity:1;border-color:var(--accent)}
/* 3D model embeds */
.m3d-frame{position:relative;padding-top:56%;background:#0a0a0a;border-radius:14px;overflow:hidden;border:1px solid var(--border)}
.m3d-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.m3d-load{position:absolute;inset:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(160deg,#0a0a0a,#141414);color:#e8e8e8;cursor:pointer;border:0;font:inherit}
.m3d-load .big{font-size:42px}
.m3d-load .b{font-weight:700;font-size:15px}
.m3d-load .sub{font-size:12px;color:#a3a3a3}
.m3d-load:hover{background:linear-gradient(160deg,#1a1a1a,#242424)}
.m3d-cap{font-size:11.5px;color:var(--text3);margin-top:6px}
.m3d-cap a{color:var(--text3);text-decoration:underline}
.m3d-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}
.section{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:20px 22px;margin-top:16px}
.section h2{font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:10px;font-weight:700}
.section p{color:var(--text)}
.section p+p{margin-top:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:16px}
.fact{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 15px}
.fact .k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--text3);margin-bottom:4px}
.fact .v{font-size:14px;font-weight:600}
.rel-row{display:flex;flex-wrap:wrap;gap:8px}
.rel{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--border);font-size:13.5px;color:var(--text);cursor:pointer}
.rel:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.rel .dot{width:7px;height:7px;border-radius:50%;background:var(--c,#4cc9f0)}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.pn a{flex:1;max-width:48%;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 16px;color:var(--text)}
.pn a:hover{border-color:var(--accent);text-decoration:none}
.pn .dir{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3)}
.pn .nm{font-weight:650;font-size:15px}
.pn a.next{text-align:right}
/* ---------- map view ---------- */
.region-list{display:flex;flex-direction:column;gap:8px}
.region-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:11px 14px;cursor:pointer}
.region-item:hover{border-color:var(--accent);text-decoration:none}
.region-item .nm{font-weight:600}
.region-item .nm small{display:block;font-weight:400;font-size:12px;color:var(--text3);margin-top:2px}
.region-item .nm .ico{color:var(--accent)}
.region-item .ct{margin-left:auto;font-size:12px;color:var(--text3);flex:none}

/* ---------- quiz ---------- */
.quiz-box{max-width:680px;margin:0 auto}
.quiz-score{display:flex;gap:10px;margin-bottom:18px;justify-content:center;flex-wrap:wrap}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px}
.qcard .q{font-size:19px;font-weight:650;line-height:1.4;margin-bottom:6px}
.qcard .qsub{color:var(--text2);font-size:14px;margin-bottom:18px}
.qcard img{border-radius:12px;background:#fff;max-height:300px;display:block;margin:0 auto 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 16px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:15px;cursor:pointer;font-weight:550}
.opt:hover{border-color:var(--accent)}
.opt .k{width:26px;height:26px;flex:none;border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text3)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt:disabled{cursor:default;opacity:.85}
.quiz-foot{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.qnote{font-size:13.5px;color:var(--text2)}
.qwhy{font-size:13px;color:var(--text2);background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;padding:9px 13px;margin-top:14px;line-height:1.45}
.lgroup{font:700 11.5px var(--font);text-transform:uppercase;letter-spacing:.09em;color:var(--text3);margin:16px 4px -2px}
.acc{font-weight:700}
.acc.good{color:#22c55e}
.acc.mid{color:#fbbf24}
.acc.bad{color:#fb7185}

/* ---------- misc ---------- */
.empty{text-align:center;padding:70px 20px;color:var(--text3)}
.empty .big{font-size:44px;margin-bottom:12px}
.footer-note{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text3);line-height:1.6}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.gitem{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff;cursor:zoom-in}
.gitem img{display:block;width:100%;height:170px;object-fit:contain}
.gitem .c{font-size:11.5px;color:#555555;background:var(--panel);padding:8px 10px;border-top:1px solid var(--border)}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
.lightbox img{max-width:94vw;max-height:82vh;border-radius:10px;background:#fff}
.lightbox .lc{color:#e8e8e8;font-size:13px;margin-top:14px;text-align:center;max-width:720px}
.lightbox .lc a{color:#ffd60a}

.b3d-stage{position:absolute;inset:0;background:#0a0a0a;overflow:hidden}
.b3d-stage canvas{display:block;width:100%;height:100%;touch-action:none}
.b3d-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:12px;color:#e8e8e8;font-size:14px;background:#0a0a0a}
.b3d-spin{width:18px;height:18px;border:2px solid #3d3d3d;border-top-color:#e8e8e8;border-radius:50%;animation:b3dsp .8s linear infinite}
@keyframes b3dsp{to{transform:rotate(360deg)}}
.b3d-tip{position:absolute;pointer-events:none;background:#1a1a1a;color:#e8e8e8;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;display:none;border:1px solid #3d3d3d;z-index:5;white-space:nowrap}
#b3dcv.quizmode{cursor:crosshair}
.b3d-quiz{position:absolute;top:calc(68px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;row-gap:7px;background:rgba(14,14,14,.93);border:1px solid #3d3d3d;border-radius:12px;padding:8px 14px;z-index:6;font-size:13.5px;color:#e8e8e8;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:min(94%,720px)}
.b3d-quiz .q-t{font-weight:700;color:#ffd60a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.b3d-quiz .q-s{color:#a3a3a3;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.b3d-quiz .q-streak{color:#f2a900}
.b3d-quiz button{background:#242424;border:1px solid #3d3d3d;color:#e8e8e8;border-radius:7px;padding:3px 9px;font:600 11.5px var(--font);cursor:pointer;white-space:nowrap}
.b3d-quiz button:hover{border-color:#ffd60a;color:#ffd60a}
.b3d-quiz .q-flash-good{color:#3ddc84;font-weight:700}
.b3d-quiz .q-flash-bad{color:#ff5d6c;font-weight:700}
.b3d-quiz .q-modes{display:flex;gap:4px;padding-right:9px;margin-right:1px;border-right:1px solid #3d3d3d}
.b3d-quiz .q-modes button.on{border-color:#ffd60a;color:#ffd60a;background:#2b2b2b}
.b3d-quiz .q-opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.b3d-quiz .q-opts .qopt{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;font-size:12.5px}
.b3d-quiz .q-opts .qopt b{color:#ffd60a;font-size:11px}
.b3d-quiz .q-opts .qopt:hover{border-color:#ffd60a}
.b3d-quiz .q-opts .qopt.right{border-color:#3ddc84;color:#3ddc84}
.b3d-quiz .q-opts .qopt.wrong{border-color:#ff5d6c;color:#ff5d6c}
.b3d-quiz .q-opts .qopt.right{background:rgba(61,220,132,.12)}
.b3d-quiz .q-opts .qopt.wrong{background:rgba(255,93,108,.12)}
.b3d-quiz .q-opts .qopt[disabled]{pointer-events:none}
.b3d-quiz .q-bar,.b3d-quiz .q-main,.b3d-quiz .qc-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;row-gap:7px;width:100%}
.b3d-quiz .q-bar{gap:6px;padding-top:7px;border-top:1px solid #2c2c2c}
.b3d-quiz .q-prog{color:#a3a3a3;font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.b3d-quiz button.flip .ico{transform:scaleX(-1)}
.b3d-quiz button[disabled]{opacity:.35;pointer-events:none}
.b3d-quiz button.pri{background:#ffd60a;border-color:#ffd60a;color:#0a0a0a}
.b3d-quiz .qc-h{display:block;width:100%;text-align:center;font-weight:700;font-size:15px}
.b3d-quiz .qc-scope{display:block;width:100%;text-align:center;color:#a3a3a3;font-size:12.5px}
.b3d-quiz .qs-stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;width:100%}
.b3d-quiz .qs-stats span{text-align:center;color:#a3a3a3;font-size:12px}
.b3d-quiz .qs-stats b{display:block;font-size:21px;color:#ffd60a}
/* quiz mode: only the quiz box stays on screen — everything else returns when it ends */
.b3d-app.quiz .b3d-regs,.b3d-app.quiz .b3d-rail,.b3d-app.quiz .b3d-dock,.b3d-app.quiz .b3d-pop,.b3d-app.quiz .b3d-hbar,.b3d-app.quiz .b3d-hint,.b3d-app.quiz .b3d-peekbtn,.b3d-app.quiz .b3d-tour,.b3d-app.quiz .b3d-search,.b3d-app.quiz .b3d-lesson,.b3d-app.quiz #b3dfocus,.b3d-app.quiz #b3dhelpbtn{display:none!important}
.b3d-quiz .q-ctl{display:flex;gap:4px}
.b3d-quiz .q-modes{border-right:0;padding-right:0;margin-right:0}
.b3d-quiz button .ico{width:13px;height:13px;vertical-align:-2px}
.b3d-quiz .q-vo.on{border-color:#ffd60a;color:#ffd60a}
.b3d-quiz .q-dot{display:inline-block;width:9px;height:9px;margin-right:3px;border-radius:50%;background:#ffc400;box-shadow:0 0 9px #ffc400;vertical-align:0;animation:qBlink 1.1s ease-in-out infinite}
@keyframes qBlink{50%{opacity:.25;box-shadow:0 0 2px #ffc400}}
/* phones: the box sits at the bottom, near the thumbs, and keeps the model clear above it */
@media(max-width:760px){
.b3d-quiz{top:auto;bottom:calc(14px + var(--safe-b));width:calc(100% - 20px);max-width:none;padding:8px 10px}

}

/* bone landmarks — cyan pins for tubercles, grooves, epicondyles and other named
   surface features that aren't separate model meshes */

.b3dlm{position:absolute;transform:translate(-50%,-160%);font:600 10px var(--font);color:#d9f6ff;background:rgba(8,24,34,.82);border:1px solid rgba(64,224,255,.45);border-radius:5px;padding:1px 5px;white-space:nowrap;pointer-events:auto;cursor:pointer}

@keyframes lmhot{50%{border-color:#9ffbff;color:#fff;box-shadow:0 0 14px rgba(64,224,255,.75)}}
.b3dlmd{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#40e0ff;box-shadow:0 0 5px rgba(64,224,255,.9);pointer-events:none}

/* ---------- full-screen 3D explorer ---------- */
body.b3d-open{overflow:hidden}

.b3d-app{position:fixed;left:0;top:0;right:0;height:100vh;height:100dvh;z-index:80;background:#0a0a0a;color:#e8e8e8;overflow:hidden;
  --bg:#0a0a0a;--panel:#141414;--panel2:#1c1c1c;--card:#161616;--card-h:#1f1f1f;--text:#e8e8e8;--text2:#b5b0a3;--text3:#8d887a;

.b3d-title{font-weight:700;font-size:15px;padding:0 6px 0 2px;white-space:nowrap;text-shadow:0 1px 8px #000}

.b3d-rail{position:absolute;left:12px;top:calc(66px + var(--safe-t));z-index:15;width:64px;max-height:calc(100dvh - 66px - var(--safe-t) - var(--above) - 12px);display:flex;flex-direction:column;gap:4px;padding:6px;overflow-y:auto;scrollbar-width:none;background:var(--g);border:1px solid var(--gb);border-radius:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

.dock-b{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:54px;height:52px;padding:0 6px;border:0;background:transparent;color:#cfcabc;border-radius:15px;cursor:pointer;font:600 10px var(--font)}
.dock-b i{font-style:normal;font-size:19px;line-height:1}
.dock-b b{font-weight:600}
.dock-b:hover{background:#242424;color:#fff}
.dock-b.on{background:rgba(255,214,10,.18);color:#ffd60a}
.dock-b.active::after{content:"";position:absolute;top:7px;right:13px;width:7px;height:7px;border-radius:50%;background:#ffd60a;box-shadow:0 0 0 2px #161616}
.dock-b[disabled]{opacity:.3;pointer-events:none}
.dock-sep{flex:none;width:1px;background:#333;margin:9px 5px}
.ly-pop{width:min(380px,calc(100% - 24px))}
.ly-ctl{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ly-st{flex:none;width:48px;height:44px;border:1px solid #3d3d3d;border-radius:12px;background:#1c1c1c;color:#f0ece0;font:700 22px/1 var(--font);cursor:pointer}
.ly-st:hover{border-color:#ffd60a;color:#ffd60a}
.ly-st[disabled]{opacity:.3;pointer-events:none}
.ly-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.ly-mid b{font:700 14px var(--font);color:#fff}
.ly-mid small{font:500 11.5px var(--font);color:#ffd60a}
.ly-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:42vh;overflow-y:auto}
.ly-row{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 10px;border:1px solid #333;border-radius:11px;background:#181818;color:#8d887a;font:600 12.5px var(--font);cursor:pointer;text-align:left}
.ly-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ly-row em{font-style:normal;font-size:11px;opacity:.8}
.ly-row .ly-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--fc);opacity:.35}
.ly-row.on{color:#f0ece0;border-color:color-mix(in srgb,var(--fc) 70%,#333);background:color-mix(in srgb,var(--fc) 14%,#181818)}
.ly-row.on .ly-dot{opacity:1;box-shadow:0 0 6px var(--fc)}
.ly-row.lk{opacity:.55}
.ly-foot{display:flex;justify-content:space-between;margin-top:10px}
.ly-foot button{background:none;border:0;color:#bdb8aa;font:600 12px var(--font);padding:8px 4px;cursor:pointer}
.ly-foot button:hover{color:#ffd60a}
.b3d-pop{position:absolute;left:50%;bottom:var(--above);z-index:19;width:min(340px,calc(100% - 24px));padding:12px 16px 14px;background:rgba(16,16,16,.96);border:1px solid var(--gb);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translate(-50%,10px);transition:opacity .15s,transform .15s}
.b3d-pop.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.b3d-pop .pop-h{display:flex;align-items:baseline;gap:8px;font:700 13px var(--font);color:#fff;margin-bottom:8px}
.b3d-pop .pop-h small{color:#8d887a;font-weight:500;font-size:11.5px}
.b3d-pop .b3d-peel{gap:12px;color:#b5b0a3}
.b3d-pop .b3d-peel input[type=range]{height:28px}
.b3d-pop .b3d-peel em{min-width:34px;text-align:right;color:#ffd60a}
.b3d-pop .b3d-ax button{padding:5px 12px;font-size:12px;background:#1c1c1c;color:#bdb8aa;border-color:#3d3d3d}
.b3d-pop .b3d-ax button.on{background:rgba(255,214,10,.18);color:#ffd60a;border-color:rgba(255,214,10,.55)}
.b3d-pop .pop-tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.b3d-pop .pop-tools .dock-b{min-width:0;height:48px}
.sysrow{display:flex;align-items:center;gap:3px}
.sysrow .stp{display:flex;gap:2px}
.sysrow .stp button{width:19px;height:19px;border-radius:50%;border:1px solid #3d3d3d;background:#1c1c1c;color:#bdb8aa;font:700 12px/1 var(--font);padding:0;cursor:pointer}
.sysrow .stp button:hover{border-color:#ffd60a;color:#ffd60a}
.fchip.peeled{opacity:.35}
.fchip.warn::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff9d0a;margin-left:5px;box-shadow:0 0 4px #ff9d0a}
.b3d-idx .idx-g h5{font:700 10px var(--font);letter-spacing:.08em;text-transform:uppercase;color:#8d887a;margin:12px 0 4px}
.b3d-idx .idx-g:first-child h5{margin-top:2px}
.b3d-idx .idx-r{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:8px;cursor:pointer;font:500 12.5px var(--font);color:#d8d2c2}
.b3d-idx .idx-r:hover{background:#222}
.b3d-idx .idx-r.on{color:#ffd60a}
.b3d-idx .idx-r [data-x]{margin-left:auto;border:0;background:none;color:#8d887a;cursor:pointer;padding:2px 4px;font-size:12px}
.b3d-idx .idx-r [data-x]:hover{color:#fff}
.b3d-app .b3d-hbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--above) + var(--rail-h));z-index:17;background:var(--g);border:1px solid var(--gb);border-radius:14px;padding:6px 8px 6px 12px;color:#e8e8e8;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap;max-width:calc(100% - 24px)}
.b3d-app .b3d-hbar button{background:#242424;color:#ffd60a;border-color:#3d3d3d;padding:5px 11px}
.b3d-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--above) + var(--rail-h) + 6px);z-index:12;max-width:calc(100% - 32px);text-align:center;padding:7px 14px;border-radius:20px;background:rgba(16,16,16,.78);border:1px solid #333;color:#cfcabc;font:500 12.5px var(--font);pointer-events:none;transition:opacity .35s}
.b3d-hint.gone{opacity:0}
.b3d-scrim{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.b3d-scrim.on{opacity:1;pointer-events:auto}
.b3d-drawer{position:absolute;top:0;bottom:0;right:0;z-index:31;width:min(400px,92vw);display:flex;flex-direction:column;background:#111;border-left:1px solid var(--gb);transform:translateX(102%);transition:transform .25s;padding-bottom:var(--safe-b);box-shadow:-12px 0 40px rgba(0,0,0,.5)}
.b3d-drawer.on{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + var(--safe-t)) 16px 12px;border-bottom:1px solid #2a2a2a;font-weight:700;font-size:16px}
.dr-body{flex:1;overflow-y:auto;padding:4px 16px 28px}
.dr-sec{margin-top:20px}
.dr-sec>h4{margin:0 0 9px;font:700 11px var(--font);letter-spacing:.1em;text-transform:uppercase;color:#8d887a}
.b3d-drawer .b3d-filters{flex-wrap:wrap;overflow:visible}
.b3d-drawer #b3dpins:empty::before{content:"Pin a structure from its info card to build a study set.";color:#8d887a;font-size:12.5px}
.b3d-drawer .pchip{padding:6px 12px;font-size:12px}
.dr-help{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:13px;color:#c9c2b0;line-height:1.45}
.dr-help b{color:#fff}
.b3d-drawer summary{cursor:pointer;font:600 13.5px var(--font);color:#e8e8e8;padding:4px 0}
.b3d-drawer details .grid{grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.b3d-drawer .b3d-cred{padding-top:6px;border-top:1px solid #2a2a2a;color:#8d887a}
.b3d-drawer .b3d-cred a{color:#ffd60a}
.b3d-retry{margin-left:12px;background:#ffd60a;color:#0a0a0a;border:0;border-radius:9px;padding:7px 14px;font:700 13px var(--font);cursor:pointer}
/* guided lesson player — a docked side panel (CA-style): pinned header,
   scrollable body, Back/Next bar stuck to the bottom */
.b3d-lesson{position:absolute;right:0;top:calc(64px + var(--safe-t));bottom:0;z-index:18;width:min(340px,88vw);display:flex;flex-direction:column;background:rgba(14,14,14,.94);border-left:1px solid var(--gb);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:b3dIn .2s ease-out}
.les-top{display:flex;align-items:center;gap:10px;padding:13px 16px 10px;border-bottom:1px solid #262626;flex:none}
.les-vbar{display:flex;align-items:center;gap:6px;padding:8px 16px;border-bottom:1px solid #262626;flex:none}
.les-cap{padding:7px 16px;border-bottom:1px solid #262626;flex:none;font:600 12.5px/1.45 var(--font);color:#ffd60a;background:rgba(255,214,10,.05)}
.les-vbar .vbtn{background:#242424;border:1px solid #3d3d3d;color:#e8e8e8;border-radius:8px;padding:5px 10px;font:600 11.5px var(--font);cursor:pointer;flex:none}
.les-vbar .vbtn:hover{border-color:#ffd60a;color:#ffd60a}
.les-vbar .vbtn.go{background:#ffd60a;color:#0a0a0a;border-color:#ffd60a;font-weight:700}
.les-vbar .vbtn.go:hover{color:#0a0a0a}
.les-vbar .vsel{margin-left:auto;min-width:0;max-width:140px;background:#1c1c1c;border:1px solid #3d3d3d;color:#a3a3a3;border-radius:8px;padding:4px 6px;font:500 10.5px var(--font)}
.les-step{font:700 12px var(--font);color:#ffd60a;letter-spacing:.04em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.les-dots{display:flex;gap:4px;flex:none}
.les-dots i{width:7px;height:7px;border-radius:50%;background:#3a3a3a}
.les-dots i.on{background:#ffd60a}
.les-x{flex:none;width:26px;height:26px;background:#242424;color:#a3a3a3;border:1px solid #3d3d3d;border-radius:8px;font:700 12px var(--font);cursor:pointer}
.les-x:hover{border-color:#ffd60a;color:#ffd60a}
.les-body{flex:1;min-height:0;font-size:13.5px;color:#c9c2b0;line-height:1.55;overflow:auto;padding:12px 16px;scrollbar-width:thin}
.les-body b{color:#e8e8e8}
.les-smp{flex:none;width:26px;height:26px;background:#242424;color:#8d887a;border:1px solid #3d3d3d;border-radius:8px;font-size:13px;cursor:pointer}
.les-smp.on{color:#0a0a0a;background:#ffd60a;border-color:#ffd60a}
.les-q{margin:8px 16px 0;padding:7px 10px;border:1px solid rgba(255,214,10,.45);border-radius:9px;background:rgba(255,214,10,.07);font:600 12.5px var(--font);color:#ffd60a;flex:none}
.les-qst{margin:5px 16px 0;font-size:12px;min-height:15px;flex:none}
.les-qst.ok{color:#4ade80;font-weight:600}
.les-qst.bad{color:#f87171}
.les-kw{color:#ffd60a}
.les-nav{display:flex;align-items:center;gap:8px;padding:10px 16px 14px;border-top:1px solid #262626;flex:none}
.les-nav button{background:#242424;color:#e8e8e8;border:1px solid #3d3d3d;border-radius:9px;padding:7px 14px;font:600 12.5px var(--font);cursor:pointer}
.les-nav button:hover{border-color:#ffd60a}
.les-nav button.pri{background:#ffd60a;color:#0a0a0a;border-color:#ffd60a;font-weight:700}
.les-nav button:disabled{opacity:.35;pointer-events:none}
.les-nav button.dim{margin-left:auto}
.les-prog{flex:1;text-align:center;font:600 11.5px var(--font);color:#8d887a}
.les-nav button.les-prog{background:none;border:0;padding:7px 4px;color:#a3a3a3}
.les-nav button.les-prog:hover{color:#ffd60a}
.les-path{flex:none;padding:7px 16px 9px;border-bottom:1px solid #262626;font:600 11px var(--font);color:#a3a3a3}
.les-path .bar{height:3px;border-radius:2px;background:#2a2a2a;margin-top:6px;overflow:hidden}
.les-path .bar i{display:block;height:100%;background:#ffd60a;transition:width .3s}
.les-outline{display:grid;gap:2px}
.les-outline button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 8px;color:#c9c2b0;font:500 13px var(--font);cursor:pointer}
.les-outline button:hover{background:#1e1e1e;color:#fff}
.les-outline button.cur{color:#ffd60a;background:rgba(255,214,10,.1)}
.les-outline button .n{flex:none;width:20px;height:20px;border-radius:50%;background:#2a2a2a;color:#a3a3a3;font:700 10.5px/20px var(--font);text-align:center}
.les-outline button.done .n{background:#14532d;color:#4ade80}
.les-q{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.les-q .les-sc{font-size:11px;color:#a3a3a3;font-weight:600}
.les-q .les-qa{margin-left:auto;display:flex;gap:5px}
.les-q .les-qa button{background:#242424;color:#e8e8e8;border:1px solid #3d3d3d;border-radius:7px;padding:3px 9px;font:600 11px var(--font);cursor:pointer}
.les-q .les-qa button:hover{border-color:#ffd60a;color:#ffd60a}
.les-q .les-qa .les-name{flex:none;min-width:0;width:140px;background:#1c1c1c;border:1px solid #3d3d3d;border-radius:7px;color:#e8e8e8;padding:4px 8px;font:500 12px var(--font)}
.les-q .les-qa .les-name:focus{outline:none;border-color:#ffd60a}
.les-q .les-qa button.bad{opacity:.45;text-decoration:line-through}
.les-q .les-qa button[data-o]{border-color:#4a5568}
.les-hint{font-size:11.5px;color:#8d887a;margin-top:8px;text-align:center}
.les-phon{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:6px 10px;background:rgba(255,214,10,.07);border:1px solid rgba(255,214,10,.35);border-radius:9px}
.les-phon button{background:none;border:0;color:#ffd60a;cursor:pointer;display:inline-flex;align-items:center;padding:0}
.les-phon code{color:#c9c2b0;font:600 12px var(--font);letter-spacing:.02em}
.les-recap{margin:0 0 12px;padding:10px 12px;background:#1c1c1c;border:1px solid #2e2e2e;border-radius:10px}
.les-recap b{display:block;color:#ffd60a;font:700 11px var(--font);letter-spacing:.05em;margin-bottom:6px}
.les-recap ul{margin:0;padding-left:18px;color:#c9c2b0;font-size:12.5px;line-height:1.65}
.les-rel{display:flex;flex-wrap:wrap;gap:6px}
.les-rl{background:#242424;border:1px solid #3d3d3d;color:#e8e8e8;border-radius:8px;padding:4px 10px;font:600 11.5px var(--font);text-decoration:none}
.les-rl:hover{border-color:#ffd60a;color:#ffd60a}
.iso-side{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}
.iso-side button{background:#242424;border:1px solid #3d3d3d;color:#a3a3a3;border-radius:7px;padding:2px 9px;font:700 10.5px var(--font);cursor:pointer;text-transform:uppercase;letter-spacing:.03em}
.iso-side button.on{background:#ffd60a;color:#0a0a0a;border-color:#ffd60a}
.b3d-app.lesson .b3d-hbar{display:none}
.b3d-app.lesson .b3d-info{display:none}
@media(max-width:760px){
  .b3d-app{--dock-h:62px;--rail-h:56px}
  .b3d-title{display:none}
  .b3d-top{gap:8px;padding:calc(8px + var(--safe-t)) 8px 8px}
  .dock-b{min-width:50px}
  .b3d-rail{left:0;right:0;top:auto;bottom:var(--above);width:auto;max-height:none;flex-direction:row;align-items:center;gap:6px;padding:6px 10px;background:none;border:0;border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity}
  .b3d-rail .b3d-presets{flex-direction:row;flex:none;gap:6px}
  .b3d-regs{left:8px;right:8px;top:calc(56px + var(--safe-t));max-width:calc(100% - 16px);width:auto;padding:4px;border-radius:16px}
  .b3d-regs .rg-cap{display:none}
  .b3d-regs .pchip{padding:7px 11px;font-size:12px}
  .b3d-app.sel .b3d-regs{max-width:calc(100% - 16px)}
  .b3d-rail{top:auto}
  .b3d-rail .pchip{flex-direction:row;gap:6px;width:auto;flex:none;padding:8px 13px;font-size:12.5px;white-space:nowrap;border-radius:20px;border-color:#363636;background:var(--g);scroll-snap-align:start}
  .b3d-rail .pchip .ic{font-size:15px}
  .b3d-app .b3d-info{left:0;right:0;top:auto;width:auto;bottom:0;max-height:46dvh;animation-name:b3dUp;border-radius:20px 20px 0 0;border-bottom:0;border-left:0;border-top:1px solid var(--gb);transition:max-height .22s ease;overscroll-behavior:contain}
  .b3d-app .b3d-info.full{max-height:74dvh}
  .b3d-app .b3d-info .badges{display:none}
  .b3d-app .inf-head{padding-top:8px}
  .b3d-app .b3d-grab{display:block;width:38px;height:4.5px;border-radius:3px;background:#4d4d4d;margin:0 auto 8px;touch-action:none;cursor:grab}
  .b3d-app .b3d-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 8px;padding:0}
  .b3d-app .b3d-actions button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;padding:8px 4px;border-radius:10px}
  .b3d-app .b3d-actions button i{font-size:16px;line-height:1.1}
  .b3d-app .b3d-actions button b{font-size:10px;font-weight:600;text-align:center}
  .b3d-app .b3d-info.has-sel{animation-name:b3dUp}
  .b3d-app .b3d-hbar{bottom:calc(var(--above) + var(--rail-h) + 4px)}
  .b3d-app .b3d-lesson{top:auto;left:0;right:0;width:auto;bottom:0;max-height:56dvh;border-left:0;border-top:1px solid var(--gb);border-radius:20px 20px 0 0;animation-name:b3dUp}
  .b3d-app .b3d-lesson .les-body{max-height:30dvh}
  .b3d-drawer{width:100vw;border-left:0}
  .b3d-drawer details .grid{grid-template-columns:1fr}
}

/* ---------- PWA ---------- */
.b3d-prog{min-width:min(300px,62%);max-width:400px;text-align:left}
.b3d-prog .t{margin-bottom:8px}
.b3d-prog .bar{height:6px;background:#2a2a2a;border-radius:6px;overflow:hidden}
.b3d-prog .bar i{display:block;height:100%;width:0;background:#ffd60a;border-radius:6px;transition:width .15s}
.b3d-prog .pct{font-variant-numeric:tabular-nums;color:#a3a3a3;font-size:12.5px;margin-top:6px}
.b3d-ctxlost{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,10,10,.72);backdrop-filter:blur(6px);z-index:30;text-align:center;padding:20px}
.b3d-upsell{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:33;width:max-content;max-width:min(460px,94%);animation:bupop .22s ease}
@keyframes bupop{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.bu-in{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:9px 12px;box-shadow:var(--shadow);font-size:13px}
.bu-ic{display:inline-flex;color:var(--accent);flex:none}
.bu-t{font-weight:600;color:var(--text);line-height:1.35}
.bu-btn{background:var(--accent);color:#141414;font-weight:800;font-size:12px;padding:6px 12px;border-radius:9px;text-decoration:none;white-space:nowrap;flex:none}
.bu-x{background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;padding:4px;flex:none}
.fchip.lk{opacity:.55}
.dr-free{background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 12%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--border));border-radius:12px;padding:12px 14px;margin:6px 0 14px;font-size:12.5px}
.dr-free b{display:block;color:var(--accent);font-size:13px;margin-bottom:3px}
.dr-free span{display:block;color:var(--text2);margin-bottom:8px;line-height:1.45}
.dr-free a{color:var(--accent);font-weight:700;text-decoration:none}
.region-item.lk,.pcard.lk,.lrow.lk{opacity:.62}
.region-item.lk .ct{color:var(--accent);font-weight:700}
.qhit.lk{opacity:.6}
.badge.qfree{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--border))}
.depth-lock{position:relative}
.depth-lock .dl-blur{filter:blur(6px);pointer-events:none;user-select:none}
.dl-card{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(330px,90%);background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:18px 20px;text-align:center;box-shadow:var(--shadow);z-index:5}
.dl-card .dl-ic{display:inline-flex;color:var(--accent);margin-bottom:4px}
.dl-card b{display:block;font-size:15px;margin-bottom:5px}
.dl-card p{color:var(--text2);font-size:12.5px;margin:0 0 12px;line-height:1.45}
.dl-card .btn{display:inline-block}
.ipl{padding:24px 12px;text-align:center}
.ipl .ipl-ic{display:inline-flex;color:var(--accent);margin-bottom:6px}
.ipl b{display:block;font-size:14px;margin-bottom:5px}
.ipl p{color:#a3a3a3;font-size:12.5px;margin:0 0 10px}
.ipl a{color:#ffd60a;font-weight:700;font-size:13px;text-decoration:none}
.pwa-actions{display:flex;gap:8px;margin-bottom:10px}
.pwa-btn{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text2);font:inherit;font-size:12px;font-weight:600;padding:7px 8px;border-radius:9px;cursor:pointer;text-align:center}
.pwa-btn:hover{color:var(--accent);border-color:var(--accent)}
.pwa-btn.done{color:var(--good);border-color:var(--good);cursor:default}
.pwa-btn .bar{height:4px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:5px}
.pwa-btn .bar i{display:block;height:100%;background:var(--accent);transition:width .15s}
.pwa-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border2);color:var(--text);padding:11px 18px;border-radius:12px;box-shadow:var(--shadow);font-size:13.5px;z-index:100;opacity:0;transition:transform .25s,opacity .25s;pointer-events:none;max-width:92vw}
.pwa-toast.on{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.pwa-toast button{background:var(--accent);border:none;color:#0a0a0a;font:inherit;font-weight:700;font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
/* ---------- Learn mode ---------- */
.lpath{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--text);transition:border-color .15s,background .15s}
.lpath:hover{border-color:var(--accent);background:var(--card-h);text-decoration:none}
.lpath .li{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--panel2);border-radius:12px}
.lpath .lm{flex:1;min-width:0}
.lpath .lt{font-weight:700;font-size:15px;margin-bottom:2px}
.lpath .ld{font-size:12.5px;color:var(--text2)}
.lpath .lbar{height:6px;background:var(--border);border-radius:6px;overflow:hidden;margin-top:8px}
.lpath .lbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.lpath .ln{flex:none;font:700 12px var(--font);color:var(--text3);text-align:right}
.lpath .ln b{display:block;font-size:15px;color:var(--text)}
.lpath.done .li{background:color-mix(in srgb,var(--good,#3ddc84) 18%,var(--panel2))}
.lrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;text-decoration:none;color:var(--text)}
.lrow:hover{border-color:var(--accent);text-decoration:none}
.lrow .lr{flex:1;min-width:0}
.lrow .ln2{font-weight:700;font-size:14px}
.lrow .lm2{font-size:12px;color:var(--text3);margin-top:1px}
.lrow .lck{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--panel2);color:var(--text3);font-size:13px}
.lrow.done .lck{background:color-mix(in srgb,var(--good,#3ddc84) 20%,var(--panel2));color:var(--good,#3ddc84)}
.lrow .lgo{flex:none;color:var(--text3);font-size:18px}
.xptoast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--panel);border:1px solid var(--accent);color:var(--text);padding:10px 18px;border-radius:12px;font:700 13.5px var(--font);z-index:120;box-shadow:var(--shadow);opacity:0;transition:transform .3s,opacity .3s;pointer-events:none}
.xptoast.on{transform:translateX(-50%) translateY(0);opacity:1}
.learn-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.learn-head .xp{margin-left:auto;display:flex;gap:8px;align-items:center}
.today{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.today>b{font-size:13px;color:var(--text3);letter-spacing:.4px;text-transform:uppercase;margin-right:4px}
.today .tstep{display:inline-flex;align-items:center;gap:6px;background:var(--panel2,#1c1c1c);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font:600 12.5px var(--font);color:var(--text);text-decoration:none}
.today .tstep:hover{border-color:var(--accent)}
.today .tstep.ok{color:var(--good,#3ddc84);border-color:color-mix(in srgb,var(--good,#3ddc84) 40%,var(--border))}
.xpbadge{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:5px 13px;font:700 12.5px var(--font)}
.xpbadge b{color:var(--accent)}
.streakb{background:var(--panel2);border:1px solid var(--border);color:#f2a900;border-radius:20px;padding:5px 13px;font:700 12.5px var(--font)}
.hero-install{display:none!important}
body.can-install .hero-install{display:inline-flex!important}
/* feature-pack additions */
.say{background:none;border:1px solid var(--border);color:var(--text3);border-radius:8px;font-size:15px;padding:2px 8px;cursor:pointer;vertical-align:6px}
.say:hover{color:var(--accent);border-color:var(--accent)}
.latin{font-style:italic;color:var(--text3);font-size:15px;margin-top:2px}
.oitable{width:100%;border-collapse:collapse;font-size:14px}
.oitable th{text-align:left;color:var(--accent);font-weight:700;padding:6px 10px 6px 0;width:110px;vertical-align:top;white-space:nowrap}
.oitable td{padding:6px 0;border-bottom:1px solid var(--border);color:var(--text)}
.oitable tr:last-child td{border-bottom:none}
.qtype{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 14px;font:500 15px var(--font)}
.qtype:focus{outline:none;border-color:var(--accent)}
.qtype.right{border-color:var(--good,#3ddc84);background:color-mix(in srgb,var(--good,#3ddc84) 12%,var(--panel2))}
.qtype.wrong{border-color:var(--bad,#ff5f56);background:color-mix(in srgb,var(--bad,#ff5f56) 12%,var(--panel2))}
.qsel{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:4px 8px;font:600 12.5px var(--font)}
.qbchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--panel2);border:1px solid var(--border);color:var(--text3);border-radius:16px;padding:5px 12px;font:600 12.5px var(--font);cursor:pointer;user-select:none}
.chip:hover{border-color:var(--accent)}
.chip.on{background:color-mix(in srgb,var(--accent) 20%,var(--panel2));color:var(--accent);border-color:var(--accent)}
.qbrow{margin:14px 0}
.qbrow>b{display:block;font-size:13px;color:var(--text2);margin-bottom:2px}
.pathprog{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px}
.pathprog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.prow{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:12px;margin:8px 0;background:var(--panel)}
.prow .pi{flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--panel2);font:700 13px var(--font);color:var(--text3)}
.prow .pt{flex:1}
.prow .pt b{font-size:14px}
.prow .pt span{display:block;font-size:12px;color:var(--text3)}
.b3dlbl.trace{color:#ffd166!important;border-color:#ffd166!important}
.kind{background:var(--accent);color:#0a0a0a;border-radius:6px;padding:1px 7px;font:700 10.5px var(--font);text-transform:uppercase;letter-spacing:.04em}
.kind-section{background:#7fb3ff}
.kind-dissection{background:#e8a33d}
.b3d-movebar{position:absolute;left:50%;bottom:calc(var(--above) + 14px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(18,18,18,.92);border:1px solid var(--gb);border-radius:14px;padding:8px 14px;z-index:20;font-size:13px;backdrop-filter:blur(10px)}
.b3d-movebar b{color:#ffd60a;font-size:12.5px}
.b3d-movebar button{background:var(--panel2);border:1px solid var(--gb);color:#e8e8e8;border-radius:8px;padding:4px 10px;cursor:pointer}
.b3d-movebar input[type=range]{width:130px}
.b3d-movebar .hint{font-size:10.5px;color:#8d887a}

/* ---------- signed-out chrome ---------- */
body.signed-out #sidebar,body.signed-out #topbar{display:none}
body.signed-out #scrim{display:none!important}
body.signed-out #main{margin-left:0}
body.signed-out #view{max-width:none;padding:0}
.boot{min-height:100vh;display:grid;place-items:center}
.boot i{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:bootspin .8s linear infinite}
@keyframes bootspin{to{transform:rotate(360deg)}}

/* ---------- landing ---------- */
.land{min-height:100vh}
.land-nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:13px 30px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.land-nav .logo{font-size:17px;cursor:default}
.land-nav .logo:hover{text-decoration:none}
.land-nav .acts{display:flex;gap:8px;align-items:center}
.land-signin{color:var(--text2);font-weight:600;font-size:13.5px;padding:9px 13px;border-radius:9px}
.land-signin:hover{color:var(--text);text-decoration:none;background:var(--panel2)}
.land-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;padding:66px 44px 58px;background:linear-gradient(160deg,#221d12,var(--bg) 72%);border-bottom:1px solid var(--border)}
[data-theme="light"] .land-hero{background:linear-gradient(160deg,#efe7cf,var(--bg) 72%)}
.land-hero::before{content:"";position:absolute;inset:0;background:url("img/hero-anatomy.jpg") center 28%/cover no-repeat;opacity:.15;pointer-events:none}
[data-theme="light"] .land-hero::before{opacity:.10}
.land-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 6%,transparent 58%),radial-gradient(90% 120% at 85% 0%,rgba(255,214,10,.15),transparent 55%);pointer-events:none}
[data-theme="light"] .land-hero::after{background:linear-gradient(90deg,var(--bg) 6%,color-mix(in srgb,var(--bg) 45%,transparent) 58%),radial-gradient(90% 120% at 85% 0%,rgba(176,141,10,.14),transparent 55%)}
.land-hero>*{position:relative;z-index:1}
.land-kick{display:inline-flex;align-items:center;gap:7px;color:var(--accent);font-weight:700;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:16px}
.land-kick .ico{width:15px;height:15px}
.land-hero h1{font-size:clamp(34px,4.8vw,56px);line-height:1.05;letter-spacing:-.025em;margin-bottom:18px}
.land-hero h1 em{font-style:normal;color:var(--accent)}
.land-hero p{max-width:560px;color:var(--text2);font-size:16px;margin:0 0 26px}
.land-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.btn.big{padding:13px 24px;font-size:15px;border-radius:13px}
.land-mini{font-size:12.5px;color:var(--text3)}
.land-art{position:relative;display:grid;place-items:center;min-height:320px}
.land-art .halo{position:absolute;width:min(30vw,380px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,214,10,.26),transparent 65%);filter:blur(8px)}
.land-frame{position:relative;border-radius:26px;overflow:hidden;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--border));box-shadow:0 34px 90px rgba(0,0,0,.55),0 0 70px rgba(255,214,10,.16);animation:landfloat 7s ease-in-out infinite}
.land-frame img{display:block;width:min(30vw,420px);max-width:100%}
.land-frame .ftag{position:absolute;left:14px;bottom:14px;display:inline-flex;align-items:center;gap:6px;background:rgba(10,10,10,.74);backdrop-filter:blur(8px);border:1px solid rgba(255,214,10,.42);color:#ffd60a;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:20px}
.land-frame .ftag .ico{width:13px;height:13px}
@keyframes landfloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(.4deg)}}
.land-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.land-stat{background:var(--panel);padding:22px 16px;text-align:center}
.land-stat b{display:block;font-size:26px;color:var(--accent);letter-spacing:-.02em}
.land-stat span{font-size:12.5px;color:var(--text3)}
.land-sec{padding:54px 40px;max-width:1180px;margin:0 auto}
.land-sec h2{font-size:26px;letter-spacing:-.02em;margin-bottom:6px}
.land-sec .sub{color:var(--text2);margin:0 0 26px}
.land-feats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.land-feat{position:relative;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;transition:border-color .15s,background .15s}
.land-feat:hover{border-color:var(--border2);background:var(--card-h)}
.land-feat .ic{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);margin-bottom:13px}
.land-feat .ic .ico{width:20px;height:20px}
.land-feat h3{font-size:15px;margin-bottom:6px}
.land-feat p{font-size:13.5px;color:var(--text2);margin:0}
.land-prem{position:absolute;top:15px;right:15px;display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.05em}
.land-prem .ico{width:11px;height:11px}
.land-prices{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.land-pfree{display:flex;flex-direction:column;gap:4px;background:var(--panel2);border:1.5px dashed var(--border2);border-radius:16px;padding:18px 16px;color:var(--text2)}
.land-pfree .pn{font-weight:700;font-size:14px}
.land-pfree .fp{font-size:22px;font-weight:800;color:var(--text)}
.land-pfree .pd{font-size:12px;color:var(--text3)}
.land-foot{border-top:1px solid var(--border);padding:26px 40px;color:var(--text3);font-size:12.5px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
@media(max-width:900px){.land-hero{grid-template-columns:1fr;padding:46px 24px}.land-art{display:none}.land-stats{grid-template-columns:repeat(2,1fr)}.land-feats,.land-prices{grid-template-columns:1fr 1fr}.land-sec{padding:42px 22px}}
@media(max-width:560px){.land-feats,.land-prices{grid-template-columns:1fr}}

/* ---------- plan cards ---------- */
.plcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plcard{position:relative;display:flex;flex-direction:column;gap:4px;background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:18px 16px 16px;cursor:pointer;text-align:left;color:var(--text);font:inherit;transition:border-color .12s,background .12s,box-shadow .12s}
.plcard:hover{border-color:var(--border2)}
.plcard.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.plcard .pn{font-weight:700;font-size:14px}
.plcard .pp{font-size:23px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
.plcard .pd{font-size:12px;color:var(--text3)}
.plcard .pn2{font-size:11.5px;color:var(--good);font-weight:700;min-height:14px}
.plcard .pb{position:absolute;top:-9px;left:14px;background:var(--accent);color:#141414;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:20px;text-transform:uppercase}
.plcard .pk{position:absolute;top:13px;right:13px;width:19px;height:19px;border:1.5px solid var(--border2);border-radius:50%;display:grid;place-items:center;color:transparent}
.plcard.on .pk{background:var(--accent);border-color:var(--accent);color:#141414}
.plcard .pk .ico{width:11px;height:11px;stroke-width:3.2}
@media(max-width:640px){.plcards{grid-template-columns:1fr}}

/* ---------- auth ---------- */
.auth-wrap{position:relative;overflow:hidden;min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:var(--bg)}
.auth-wrap::before{content:"";position:absolute;inset:0;background:url("img/hero-anatomy.jpg") center 30%/cover no-repeat;opacity:.12;pointer-events:none}
[data-theme="light"] .auth-wrap::before{opacity:.08}
.auth-wrap::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 85% at 50% 38%,color-mix(in srgb,var(--bg) 35%,transparent) 20%,var(--bg) 92%),radial-gradient(80% 100% at 50% -10%,rgba(255,214,10,.12),transparent 60%);pointer-events:none}
.auth-card{position:relative;z-index:1}
.auth-card::before{content:"";position:absolute;top:0;left:26px;right:26px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:34px 32px;box-shadow:var(--shadow)}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.auth-logo img{width:30px;height:30px;border-radius:8px}
.auth-logo b{font-size:17px}
.auth-card h1{font-size:23px;letter-spacing:-.02em;margin-bottom:6px}
.auth-sub{color:var(--text2);font-size:13.5px;margin:0 0 24px}
.auth-gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:11px;border:1px solid var(--border2);background:#fff;color:#1f1f1f;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.auth-gbtn:hover{background:#f3f3f3}
.auth-gbtn svg{width:18px;height:18px;flex:none}
.auth-or{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text3);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--border)}
.auth-f{margin-bottom:14px}
.auth-f label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.auth-f input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font:inherit;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.auth-f input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.auth-err{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid color-mix(in srgb,var(--bad) 42%,transparent);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.auth-err .ico{flex:none;width:15px;height:15px;margin-top:1px}
.auth-ok{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--good) 12%,transparent);border:1px solid color-mix(in srgb,var(--good) 42%,transparent);color:var(--good);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.auth-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:11px;border:none;background:var(--accent);color:#141414;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer}
.auth-btn:hover{filter:brightness(1.08)}
.auth-btn:disabled{opacity:.6;cursor:default}
.auth-alt{margin-top:18px;text-align:center;font-size:13.5px;color:var(--text3)}
.auth-alt button{color:var(--accent);font-weight:600;background:none;border:none;font:inherit;cursor:pointer;padding:0}
.auth-alt button:hover{text-decoration:underline}
.auth-forgot{margin-top:12px;text-align:center}
.auth-forgot button{background:none;border:none;color:var(--text3);font:inherit;font-size:12.5px;cursor:pointer}
.auth-forgot button:hover{color:var(--accent)}
.auth-note{margin-top:24px;text-align:center;font-size:11.5px;color:var(--text3);line-height:1.5}
.auth-back{display:inline-flex;align-items:center;gap:6px;color:var(--text3);font-size:13px;margin-bottom:18px}
.auth-back:hover{color:var(--text);text-decoration:none}
.auth-back .ico{width:15px;height:15px}
.auth-ve{text-align:center}
.auth-ve .ve-ic{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--accent-soft);color:var(--accent);margin-bottom:16px}
.auth-ve .ve-ic .ico{width:26px;height:26px}
.auth-ve p{color:var(--text2);font-size:14px}

/* ---------- premium / paywall ---------- */
.gate{max-width:780px;margin:0 auto;padding:6px 0 90px}
