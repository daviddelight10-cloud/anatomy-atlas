<script>
/* ============ Anatomy Atlas — app ============ */
(function(){
"use strict";
const DATA = window.ATLAS_DATA;
const IMAGES = window.ATLAS_IMAGES || {};
/* dissection/specimen photos & cross-sections — merged into IMAGES at boot so
   they appear as extra plates with a "dissection"/"section" badge */
if (window.ATLAS_EXTRAS) for (const k in ATLAS_EXTRAS) {
  const e = IMAGES[k] = IMAGES[k] || { extras: [] };
  (e.extras = e.extras || []).push(...ATLAS_EXTRAS[k]);
  if (!e.url && e.extras.length){ e.url = e.extras[0].url; e.thumb = e.extras[0].thumb||e.extras[0].url;
    e.title = e.extras[0].title; e.license = e.extras[0].license; e.page = e.extras[0].page; e.kind = e.extras[0].kind; }
}
const MODELS = window.ATLAS_MODELS || {};
const META = window.ATLAS_META;
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- text & speech helpers ---------- */
const normTxt = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const lev = (a,b) => { a=normTxt(a); b=normTxt(b); const n=a.length,m=b.length;
  if(Math.abs(n-m)>3) return 9; const d=[]; for(let i=0;i<=n;i++)d[i]=[i];
  for(let j=0;j<=m;j++)d[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[n][m]; };
const triScore = (q,s) => { q=normTxt(q); s=" "+normTxt(s)+" "; if(!q||q.length<3) return 0;
  const grams = new Set(); for(let i=0;i<q.length-2;i++) grams.add(q.slice(i,i+3));
  let hit=0; for(const g of grams) if(s.includes(g)) hit++;
  return hit/grams.size; };
/* fuzzy name match for typed answers + "did you mean": accepts ≤1-2 typos or strong trigram overlap */
const fuzzyMatch = (input, names) => { const i2=normTxt(input); if(!i2) return false;
  return names.filter(Boolean).some(n=>{ const t=normTxt(n); if(!t) return false;
    if(i2===t) return true;
    const short = t.split(" ").filter(w=>w.length>2).join(" ")||t;
    if(lev(i2,t)<=Math.max(1,Math.floor(t.length*0.12))) return true;
    if(lev(i2,short)<=Math.max(1,Math.floor(short.length*0.12))) return true;
    return triScore(i2,t)>=0.72; }); };
/* offline, network voices (e.g. desktop Chrome's "Google …") fail silently — prefer on-device ones then */
const sayVoices = () => { try{ return speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang)); }catch(e){ return []; } };
const sayVoicePick = () => { try{ return localStorage.getItem("atlas-voice")||""; }catch(e){ return ""; } };
const setSayVoicePick = n => { try{ localStorage.setItem("atlas-voice", n); }catch(e){} };
const voiceScore = v => { const n = (v.name||"").toLowerCase(); let s = 0;
  if(/natural|neural|\bhd\b|wavenet|journey/.test(n)) s += 50;   // neural-grade voices (Edge/Chrome)
  if(/premium|enhanced|super/.test(n)) s += 30;                  // Apple/OS upgraded voices
  if(/google/.test(n)) s += 15;                                  // Chrome's network voices
  if(/female|samantha|zira|aria|jenny|sonia|serena|victoria|karen|moira|tessa|zoe|siri/.test(n)) s += 10;
  if(v.localService) s += 5;
  if(!v.localService && navigator.onLine===false) s -= 60;       // can't actually speak offline
  return s; };
const _sayVoice = () => { const en = sayVoices(); if(!en.length) return null;
    const picked = sayVoicePick(), chosen = picked && en.find(v=>v.name===picked);
    if(chosen && (chosen.localService || navigator.onLine!==false)) return chosen;
    return en.map(v=>[voiceScore(v),v]).sort((a,b)=>b[0]-a[0])[0][1]; };
try{ speechSynthesis.getVoices(); speechSynthesis.addEventListener("voiceschanged",()=>speechSynthesis.getVoices()); }catch(e){}
/* respellings for terms the default voice mangles (matched whole-word, case-insensitive) */
const PRONOUNCE = { "sternocleidomastoid":"stur-no-kly-doe-mass-toid", "zygomatic":"zy-go-mat-ik", "zygomaticus":"zy-go-mat-ik-us",
  "brachioradialis":"bray-kee-oh-ray-dee-ay-lis", "brachialis":"bray-kee-ay-lis", "brachii":"bray-key-eye", "biceps":"bye-seps", "triceps":"try-seps",
  "gastrocnemius":"gas-trok-nee-me-us", "latissimus dorsi":"la-tiss-i-mus dor-sy", "trapezius":"tra-pee-zee-us", "femoris":"fem-or-is",
  "tibialis":"tib-ee-ay-lis", "fibularis":"fib-yoo-lair-is", "peroneus":"per-oh-nee-us", "humerus":"hyoo-mer-us", "ilium":"il-ee-um", "ischium":"is-kee-um",
  "coccyx":"kok-six", "sphenoid":"sfee-noid", "ethmoid":"eth-moid", "masseter":"mass-eh-ter", "orbicularis oculi":"or-bik-yoo-lair-is ok-yoo-lie",
  "orbicularis oris":"or-bik-yoo-lair-is or-is", "pectoralis":"pek-tor-ay-lis", "serratus":"ser-ay-tus", "infraspinatus":"in-fra-spy-nay-tus",
  "supraspinatus":"soo-pra-spy-nay-tus", "subscapularis":"sub-skap-yoo-lair-is", "sartorius":"sar-tor-ee-us", "gracilis":"gras-i-lis", "soleus":"so-lee-us",
  "aorta":"ay-or-ta", "vena cava":"vee-na kay-va", "trachea":"tray-kee-a", "esophagus":"ee-sof-a-gus", "duodenum":"doo-oh-dee-num", "jejunum":"jeh-joo-num",
  "ileum":"il-ee-um", "cecum":"see-kum", "pylorus":"pie-lor-us", "diaphragm":"die-a-fram", "pharynx":"fair-inks", "larynx":"lair-inks", "sciatic":"sigh-at-ik",
  "ulna":"ul-na", "metacarpals":"met-a-kar-pals", "metatarsals":"met-a-tar-sals", "phalanges":"fa-lan-jeez", "calcaneus":"kal-kay-nee-us", "hyoid":"high-oid",
  "foramen magnum":"for-ay-men mag-num", "foramen":"for-ay-men", "thoracic":"thor-ass-ik", "xiphoid":"zy-foid", "manubrium":"ma-new-bree-um",
  "acromion":"a-kro-mee-on", "coracoid":"kor-a-koid", "glenoid":"glee-noid", "olecranon":"oh-lek-ra-non", "trochanter":"tro-kan-ter",
  "epicondyle":"ep-ee-kon-dyl", "condyle":"kon-dyl", "meatus":"mee-ay-tus", "rhomboid":"rom-boid", "levator scapulae":"le-vay-tor skap-yoo-lee" };
const _PRON = Object.keys(PRONOUNCE).sort((a,b)=>b.length-a.length).map(k=>[new RegExp("\\b"+k+"\\b","gi"), PRONOUNCE[k]]);
const speakable = t => { let s = String(t||"").replace(/&/g," and ").replace(/\s*[\/()]\s*/g,", ");
  for(const [re,r] of _PRON) s = s.replace(re,r); return s; };
/* speech generation guard — every new utterance (or stop) invalidates
   callbacks pending on older ones, so a canceled narration can't fire a
   "finished" callback later */
let _speechGen = 0;
const say = text => { try{ ++_speechGen; speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(speakable(text)); u.rate=0.92; const v=_sayVoice(); if(v)u.voice=v;
    speechSynthesis.speak(u); }catch(e){} };
/* quiz voice: preference, queued speech with a guaranteed completion callback, stop, iOS unlock */
const qVoiceOn = () => { try{ return localStorage.getItem("atlas-qvoice")!=="0"; }catch(e){ return true; } };
const setQVoice = v => { try{ localStorage.setItem("atlas-qvoice", v?"1":"0"); }catch(e){} };
/* lesson read-through voice — same pattern, its own preference */
const lVoiceOn = () => { try{ return localStorage.getItem("atlas-lvoice")!=="0"; }catch(e){ return true; } };
const setLVoice = v => { try{ localStorage.setItem("atlas-lvoice", v?"1":"0"); }catch(e){} };
const sayStop = () => { ++_speechGen;
  try{ speechSynthesis.resume(); speechSynthesis.cancel(); }catch(e){} };
const sayQ = (text, o) => { o = o || {}; let done = false, tm = null;
  const g = ++_speechGen;
  const fin = () => { if(done) return; done = true; clearTimeout(tm); if(o.onend) o.onend(); };
  tm = setTimeout(fin, o.max || 4500);
  try{ if(!("speechSynthesis" in window)){ fin(); return; }
    speechSynthesis.resume();                 // unblock a paused engine
    if(!o.queue) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(speakable(text)); u.rate = o.rate || 0.95; u.pitch = o.pitch || 1.06; const v = _sayVoice(); if(v) u.voice = v;
    u.onend = fin; u.onerror = fin; speechSynthesis.speak(u);
  }catch(e){ fin(); } };
/* narration voice: sentence-by-sentence with a breath between each —
   reads like a tutor instead of a wall of text */
const sayParts = (text, o) => { o = o || {}; let done = false, tm = null, gapTm = null;
  const g = ++_speechGen;
  const fin = () => { if(done) return; done = true; clearTimeout(tm); clearTimeout(gapTm); if(o.onend) o.onend(); };
  const parts = String(text||"").match(/[^.!?;:]+[.!?;:]+["')\]]*|\S[^.!?;:]*$/g) || [];
  tm = setTimeout(fin, o.max || 20000);
  try{ if(!("speechSynthesis" in window) || !parts.length){ fin(); return; }
    speechSynthesis.resume();                 // unblock a paused engine
    speechSynthesis.cancel();
    const v = _sayVoice(), rate = o.rate || 0.92;
    let i = 0;
    const nxt = () => { if(g!==_speechGen) return;
      if(i>=parts.length){ fin(); return; }
      const k = i, txt = parts[k].trim();
      const u = new SpeechSynthesisUtterance(speakable(txt));
      u.rate = o.slow && o.slow.test(txt) ? rate*0.9 : rate;   // linger on the term being taught
      u.pitch = o.pitch || 1.06; if(v) u.voice = v;
      u.onstart = () => { if(g===_speechGen && o.onpart) o.onpart(k, txt); };
      u.onend = () => { i++;
        const gap = i<parts.length ? (/^Your turn/i.test(parts[i].trim()) ? 650 : 330) : 0;
        gapTm = setTimeout(nxt, gap); };
      u.onerror = () => { i++; nxt(); };
      speechSynthesis.speak(u); };
    nxt();
  }catch(e){ fin(); } };
/* make written anatomy speakable: expand abbreviations, ordinals and
   letter-names the default voice mangles (applied before speakable) */
const SPEAK_FIX = [
  [/\bCMC\b/g,"carpometacarpal"], [/\bMCP\b/g,"metacarpophalangeal"], [/\bPIP\b/g,"proximal interphalangeal"],
  [/\bDIP\b/g,"distal interphalangeal"], [/\bIP\b/g,"interphalangeal"], [/\bROM\b/g,"range of motion"],
  [/\bACL\b/g,"anterior cruciate ligament"], [/\bPCL\b/g,"posterior cruciate ligament"],
  [/\bMCL\b/g,"medial collateral ligament"], [/\bLCL\b/g,"lateral collateral ligament"],
  [/\bSCM\b/g,"sternocleidomastoid"], [/\bTMJ\b/g,"temporomandibular joint"],
  [/\b(?:EKG|ECG)\b/g,"E C G"], [/\bCSF\b/g,"cerebrospinal fluid"], [/\bCNS\b/g,"central nervous system"],
  [/\bPNS\b/g,"peripheral nervous system"], [/\be\.g\./g,"for example"], [/\bi\.e\./g,"that is"],
  [/\bvs\.?/g,"versus"], [/\bapprox\.?/g,"approximately"],
  [/\bT(\d+)\b/g,(m,n)=>`T ${n}`], [/\bC(\d+)\b/g,(m,n)=>`C ${n}`], [/\bL(\d+)\b/g,(m,n)=>`L ${n}`],
  [/(\d+)(?:st|nd|rd|th)\b/gi,(m,n)=>({"1":"first","2":"second","3":"third","4":"fourth","5":"fifth","6":"sixth","7":"seventh","8":"eighth","9":"ninth","10":"tenth","11":"eleventh","12":"twelfth","13":"thirteenth","14":"fourteenth","15":"fifteenth","16":"sixteenth","17":"seventeenth","18":"eighteenth","19":"nineteenth","20":"twentieth","21":"twenty-first","22":"twenty-second","23":"twenty-third","24":"twenty-fourth","25":"twenty-fifth","26":"twenty-sixth","27":"twenty-seventh","28":"twenty-eighth","29":"twenty-ninth","30":"thirtieth"})[n]||m],
  [/([A-Za-z]\s*\d)\s*[\u2013\u2014]\s*([A-Za-z]?\s*\d)/g,"$1 to $2"],

const spokenize = t => { let s = String(t||""); for(const [re,r] of SPEAK_FIX) s = s.replace(re,r); return s; };
let _sayUnlocked = false;
const sayUnlock = () => { if(_sayUnlocked) return; _sayUnlocked = true;
  try{ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }catch(e){} };
/* delegated 🔊 buttons anywhere in the app */
document.addEventListener("click", e => { const b = e.target.closest && e.target.closest("[data-say]");
  if(b){ e.preventDefault(); e.stopPropagation(); say(b.dataset.say); } });

const byId = {};
DATA.forEach(d => byId[d.id] = d);
/* bone landmarks become first-class inventory records: searchable, browsable,
   quizzable, with their own part pages. `of` = parent mesh id (3D deep links);
   `ofRec` = parent DATA record id (part-page links) — they differ for the
   pelvis (mesh "hip-bone", article "pelvic-girdle"). */
const LM_PID2REC = { "hip-bone": "pelvic-girdle" };
const LM_BY = {};
if (window.ATLAS_LM) for (const pid in window.ATLAS_LM) {
  const recId = LM_PID2REC[pid] || pid;
  const p = byId[recId]; if (!p) continue;
  LM_BY[recId] = window.ATLAS_LM[pid].map(L => {
    let rec = byId[L.id];
    if (!rec) {
      rec = { id: L.id, name: L.n, aka: L.aka || "", system: p.system, region: p.region,
        tags: ["landmark", "bone feature", p.name.toLowerCase()],
        summary: L.d, structure: "", fn: "", clinical: L.c || "", related: [recId], of: pid, ofRec: recId,
        att: L.att || "", art: L.art || "", pal: L.pal || "" };

    } else { rec.of = pid; rec.ofRec = recId; if (!rec.clinical && L.c) rec.clinical = L.c; }
    return rec;
  });
}
const SYSTEMS = META.systems, REGIONS = META.regions;

if (window.ATLAS_OI) for (const id in ATLAS_OI) { const d = byId[id]; if (d && !d.oi) d.oi = ATLAS_OI[id]; }

const imgOf = id => IMAGES[id] || null;
const DIAGRAMS = window.ATLAS_DIAGRAMS || {};
const ARTICLES = window.ATLAS_ARTICLES || {};
const DIAGRAMS_FOR = {};
for (const k in DIAGRAMS) (DIAGRAMS[k].for || [k]).forEach(id => { DIAGRAMS_FOR[id] = k; });
const schematicInner = id => {
  const g = DIAGRAMS[DIAGRAMS_FOR[id]]; if (!g) return "";
  const focus = g.focus && g.focus[id];
  const node = n => {
    const w = n.w || 96, h = n.h || 28, c = n.c || "#8b95a9";
    const inner = `<rect x="${n.x}" y="${n.y}" rx="7" width="${w}" height="${h}" fill="var(--panel)" stroke="${c}" stroke-width="1.5"/><text x="${n.x + w / 2}" y="${n.y + h / 2 + (n.s ? 3.5 : 4)}" text-anchor="middle" font-size="${n.s ? 10 : 11.5}" font-weight="600" fill="var(--text)" font-family="inherit">${n.l}</text>`;
    return n.to && byId[n.to] ? `<a href="#/part/${n.to}">${inner}</a>` : `<g>${inner}</g>`;
  };
  const edges = g.edges.map(([a, b, o]) => {
    const A = g.nodes[a], B = g.nodes[b];
    const x1 = A.x + (A.w || 96), y1 = A.y + (A.h || 28) / 2, x2 = B.x, y2 = B.y + (B.h || 28) / 2, mx = (x1 + x2) / 2;
    return `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none" stroke="${B.c || "#8b95a9"}" stroke-width="${o && o.d ? 1.5 : 2.2}"${o && o.d ? ' stroke-dasharray="5 4" opacity=".7"' : ""}/>`;
  }).join("");
  const nodes = Object.keys(g.nodes).map(k => `<g class="${k === focus ? "on" : ""}">${node(g.nodes[k])}</g>`).join("");
  const heads = (g.cols || []).map(([t, x]) => `<text x="${x}" y="14" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.5" fill="var(--text3)" font-family="inherit">${t.toUpperCase()}</text>`).join("");
  return `<div class="schematic"><svg viewBox="0 0 ${g.w || 760} ${g.h || 400}" role="img" aria-label="${esc(g.title || id)}">${heads}${edges}${nodes}</svg>${g.cap ? `<div class="sc-cap">${esc(g.cap)}</div>` : ""}</div>`;
};
const schematicSVG = id => {
  const s = schematicInner(id);
  return s ? `<div class="section"><h2>Schematic</h2>${s}</div>` : "";
};
const imgTag = (id,cls) => { const im = imgOf(id); return im ? `<img class="${cls}" src="${esc(im.thumb||im.url)}" alt="" loading="lazy" onerror="this.remove()">` : `<span class="${cls} ph">${esc(systemIcon(id))}</span>`; };

/* Stream model.bin (gzipped GLB) with real progress — the SW caches it on first fetch. */
async function fetchModel(prog){
  const r = await fetch("model.bin");
  if(!r.ok) throw new Error("model.bin download failed: "+r.status);
  const total = +r.headers.get("content-length") || 20565892;
  if(!r.body || !r.body.getReader) return new Uint8Array(await r.arrayBuffer());
  const rd = r.body.getReader(), parts = [];
  let got = 0, last = 0;
  for(;;){
    const {done, value} = await rd.read();
    if(done) break;
    parts.push(value); got += value.length;
    const now = performance.now();
    if(now - last > 120){
      last = now;
      prog(`Downloading the 3D body — ${(got/1048576).toFixed(1)} MB (one-time, then offline)`, Math.min(99, got/total*100));
    }
  }
  const out = new Uint8Array(got);
  for(let o=0, i=0; i<parts.length; i++){ out.set(parts[i], o); o += parts[i].length; }
  return out;
}
async function loadBodyGlb(){

  const gz = await fetchModel(prog);
  prog("Unpacking the original Z-Anatomy body — a few seconds the first time…");
  const buf = (gz[0]===0x1f && gz[1]===0x8b)
    ? await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()

/* Tear down the previous 3D session before rebuilding — every visit used to
   leak a whole WebGL context + its buffers, which is the main driver of the
   memory pressure that makes iOS Safari force-reload the tab. Shared model
   data (B3D.gltf geometries/materials) is deliberately NOT disposed. */
function destroyScene(){
  sayStop();
  try{ if(B3D.composer){ if(B3D.composer.dispose) B3D.composer.dispose(); B3D.composer = null; } }catch(e){}
  try{ if(B3D.ssao){ if(B3D.ssao.dispose) B3D.ssao.dispose(); B3D.ssao = null; } }catch(e){}
  try{ if(B3D.envRT){ B3D.envRT.dispose(); B3D.envRT = null; } }catch(e){}
  try{ if(B3D.controls){ B3D.controls.dispose(); B3D.controls = null; } }catch(e){}
  const r = B3D.renderer;
  if(r){
    B3D.renderer = null;
    try{ r.dispose(); }catch(e){}
    try{ r.forceContextLoss(); }catch(e){}
  }
}

      _sph.copy(m.geometry.boundingSphere).applyMatrix4(m.matrixWorld);
      r = Math.max(r, c.distanceTo(_sph.center) + _sph.radius); });
    return { c, r }; };
  const focusOn = id => { const p = partCenter(id); if(!p) return;
    flyTo(p.c, p.r); select(id); };

  /* picking */
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  const tip = $("#b3dtip"), info = $("#b3di");
  /* panel renders through setInfo so the floating card gets a close button */
  const setInfo = html => { const hd = html.startsWith('<div class="inf-head"');
    info.innerHTML = `<div class="b3d-grab"></div><button class="b3d-iclose" id="b3dic" title="Close" aria-label="Close">${I("x")}</button>${hd?html:`<div class="inf-body">${html}</div>`}`;
    { const h = info.querySelector(".inf-head");
      if(h){ const g = info.querySelector(":scope>.b3d-grab"), cb = info.querySelector(":scope>#b3dic"); if(g) h.prepend(g); if(cb) h.appendChild(cb); } }
    const c = info.querySelector("#b3dic"); if(c) c.addEventListener("click",()=>select(null)); };
  { const ic0 = info.querySelector("#b3dic"); if(ic0) ic0.addEventListener("click",()=>select(null)); }
  /* mobile sheet: drag or tap the grab handle to expand/collapse (delegated —
     survives setInfo rewrites) */
  { let gY = null, gMoved = false;
    info.addEventListener("pointerdown",e=>{ if(!e.target.closest(".b3d-grab")) return;
      gY = e.clientY; gMoved = false; });
    info.addEventListener("pointermove",e=>{ if(gY===null) return;
      const dy = gY - e.clientY;
      if(Math.abs(dy) > 24){ info.classList.toggle("full",dy>0); gMoved = true; gY = null; dockSync(); } });
    const gEnd = () => { if(gY!==null && !gMoved){ info.classList.toggle("full"); dockSync(); } gY = null; };
    info.addEventListener("pointerup",gEnd); info.addEventListener("pointercancel",()=>{ gY = null; });
    info.addEventListener("transitionend",()=>{ if(selected) dockSync(); }); }
  /* fast raycast: test only the few visible meshes whose bounding sphere the
     ray actually hits — a whole-scene raycast stalls for a beat when it
     triangle-tests dense meshes like the 300k-vert scapula */
  const _rsph = new THREE.Sphere(), _rdir = new THREE.Vector3();
  const rayMeshes = () => {
    const cand = [];
    for(const m of visList){
      const g = m.geometry; if(!g) continue;
      if(!g.boundingSphere) g.computeBoundingSphere();
      _rsph.copy(g.boundingSphere).applyMatrix4(m.matrixWorld);
      if(ray.ray.intersectsSphere(_rsph)){
        _rdir.copy(_rsph.center).sub(ray.ray.origin).dot(ray.ray.direction);
        cand.push([_rdir.lengthSq(), m]); } }
    cand.sort((a,b)=>a[0]-b[0]);
    /* cap high enough that a ray threading many ghost meshes still reaches
       the visible target behind them — sphere tests are cheap, triangle
       tests on this many are still fast */
    return cand.slice(0,48).map(c=>c[1]);
  };
  const pick = e => {
    const r = cv.getBoundingClientRect();
    ptr.x = ((e.clientX-r.left)/r.width)*2-1; ptr.y = -((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(ptr,camera);
    const hits = ray.intersectObjects(rayMeshes(), false);
    const h = hits.find(x => x.object.userData.partId && !x.object.userData.ghost && effVis(x.object));
    if(h){ pick.pt = h.point.clone(); pick.pid = h.object.userData.partId; }
    else pick.pid = null;
    return h ? h.object : null;
  };
  /* glow clones the (often shared) base material once so only the picked part lights up */
  const _tint = new THREE.Color();
  const selHex = () => 0x0f7a3d;
  /* tintOnly → highlight by color alone (no emissive): the part keeps its own
     shading so bumps/roughness still read; quizzes/hover keep the emissive flash */
  /* one tinted clone per SOURCE material — persistent selection no longer
     clones per mesh (the humerus family was cloning on every first tap) */
  const selTintPool = new Map();
  const glow = (m,hex,tintOnly)=>{ if(!m) return;
    const base = m.userData.baseMat || m.material;
    if(hex){
      if(tintOnly){ let gm = selTintPool.get(base);
        if(!gm || gm.userData.hex!==hex){ gm = base.clone(); gm.userData.src = base;
          gm.userData.hex = hex; gm.emissive.setHex(0);
          if(base.color) gm.color.copy(base.color).lerp(_tint.setHex(hex), .55);
          selTintPool.set(base, gm); }
        m.userData.selMat = gm; if(!m.userData.ghost) m.material = gm; }
      else { if(!m.userData.glowMat || m.userData.glowMat.userData.src!==base){
          m.userData.glowMat = base.clone(); m.userData.glowMat.userData.src = base; }
        m.userData.glowMat.emissive.setHex(hex);
        if(base.color) m.userData.glowMat.color.copy(base.color).lerp(_tint.setHex(hex), .35);
        if(!m.userData.ghost) m.material = m.userData.glowMat; } }
    else { m.userData.selMat = null;
      if(m.userData.glowMat){ m.userData.glowMat.emissive.setHex(0);
        if(base.color) m.userData.glowMat.color.copy(base.color); }
      m.material = m.userData.ghost ? ghostOf(base)
        : faded.has(m.userData.partId) ? fadeOf(base) : base; } poke(); };

  /* ---- undo: snapshot {hidden,isolated} before each mutating action ---- */
  const undoBtn = $("#b3dundo");
  const syncUndo = () => { if(undoBtn) undoBtn.disabled = !undoStack.length; };
  const pushHist = () => { undoStack.push({h:[...hidden], f:[...faded], iso:isolated, reg:isoRegion, fs:focusSet?[...focusSet]:null});
    if(undoStack.length>30) undoStack.shift(); syncUndo(); };
  const undo = () => { const s = undoStack.pop(); if(!s) return;
    hidden.clear(); s.h.forEach(id=>hidden.add(id));
    faded.clear(); (s.f||[]).forEach(id=>faded.add(id));
    isolated = s.iso; isoSide = null; isoRegion = s.reg===undefined ? isoRegion : s.reg; focusSet = s.fs ? new Set(s.fs) : null;
    applyVis(); syncHiddenBar(); syncUndo(); };
  if(undoBtn) undoBtn.addEventListener("click",undo);
  const onKey = e => { if(!document.body.contains(cv)){ removeEventListener("keydown",onKey); return; }
    if(e.key==="Escape"){
      if(pops.some(p=>p.classList.contains("on"))) closePops();
      else if(drawer.classList.contains("on")) closeDrawer();
      else if(quiz.on) quizStop();
      else if(lesson.on) lesClose();
      else if(selected) select(null);
      return; }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && !e.target.matches("input,textarea")){
      e.preventDefault(); undo(); } };
  addEventListener("keydown",onKey);

  /* ---- 3D quiz: "Find it" (tap the named structure), "Name it" (pin-test on a
     spotlighted structure) and "Mix". Spot questions ghost every other part —
     like Complete Anatomy pin-tests — and show 4 name options. ---- */
  const quizPool = () => Object.keys(meshes).filter(id=>byId[id] && anyVis(id) && !id.startsWith("z:"));
  const QUIZ_MODES = [["tap",I("target")+" Find it"],["spot",I("lightbulb")+" Name it"],["mix",I("shuffle")+" Mix"]];
  const QUIZ_LENS = [5,10,20,0];
  const OPT_LETTERS = "ABCD";
  const qBump = () => (quiz.gen = (quiz.gen|0) + 1);
  const quizLive = () => quiz.on && document.body.contains(cv);
  const quizScope = () => { const rg = (REGIONS_3D.find(r=>r[0]===isoRegion)||[])[2] || "Whole body";
    const pi = presetIdx(); return `${rg} · ${pi>=0 ? SYSPRESETS[pi][1] : "Custom"}${free3d?" · skeleton":""}`; };
  /* spoken form of a question — never includes the answer in Name-it mode */
  const quizQText = e => e.qtype==="spot" && e.shown
    ? "Which structure is highlighted? " + e.shown.map((o,i)=>`${OPT_LETTERS[i]}. ${nameOf(o)}.`).join(" ")
    : `Find the ${nameOf(e.t)}.`;
  const quizSpeak = (force) => { if(!quizLive() || !quiz.target || (!force && !qVoiceOn())) return;
    const g = quiz.gen;   /* small delay: Chrome can swallow speech issued right after cancel() */
    setTimeout(()=>{ if(g!==quiz.gen || !quizLive() || !quiz.target) return;
      sayQ(quizQText({t:quiz.target, qtype:quiz.qtype, shown:quiz.shown})); }, 80); };
  /* feedback is spoken, then the next question follows once it finishes (never before the old minimum) */
  const quizFeedback = (spoken, minMs, next) => { const g = qBump();
    const go = () => { if(g!==quiz.gen || !quizLive()) return; next(); };
    if(qVoiceOn()){ const t0 = Date.now();
      sayQ(spoken, {onend:()=>setTimeout(go, Math.max(0, minMs-(Date.now()-t0)))}); }
    else setTimeout(go, minMs); };

  /* Name-it: the structure to identify blinks gold until it is answered */
  const quizPulseOn = t => { each(t,mm=>glow(mm,0xffc400)); quiz.pulse = t; };
  const quizPulseOff = clear => { const p = quiz.pulse; if(!p) return; quiz.pulse = null;
    each(p,mm=>{ if(mm.userData.glowMat) mm.userData.glowMat.emissiveIntensity = 1; if(clear) glow(mm,0); }); };

  /* ---- history: questions already asked, for read-only review ---- */
  const quizLast = () => quiz.phase==="end" ? quiz.hist.length-1
    : (quiz.cur && quiz.cur.res!==null ? quiz.hist.length-1 : quiz.hist.length-2);
  const quizReview = i => { if(i<0 || i>=quiz.hist.length) return;
    qBump(); sayStop(); quizPulseOff(true); quiz.view = i; const e = quiz.hist[i];
    focusSet = new Set([e.t]); applyVis();
    const p = partCenter(e.t); if(p) flyTo(p.c, p.r);
    quizPaint(); };
  const quizPrev = () => { const i = quiz.view===-1 ? quizLast() : quiz.view-1; if(i>=0) quizReview(i); };
  const quizBack = () => { qBump(); sayStop(); quiz.view = -1;
    if(focusSet){ focusSet = null; applyVis(); }
    if(quiz.phase==="end"){ quizPaint(); return; }
    if(quiz.target){   /* the live question was never answered — put it back as it was */
      if(quiz.qtype==="spot"){ focusSet = new Set([quiz.target]); applyVis(); quizPulseOn(quiz.target);
        const p = partCenter(quiz.target); if(p) flyTo(p.c, p.r); }
      quizPaint(); quizSpeak(); }
    else quizNext(); };
  const quizForward = () => { if(quiz.view>=0 && quiz.view<quizLast()) quizReview(quiz.view+1); else quizBack(); };

  /* ---- painting: start card, running box, review, summary ---- */
  const qbtn = (a, ic, title, text, cls, dis) =>
    `<button class="${cls||""}" data-q="${a}" title="${title}" aria-label="${title}"${dis?" disabled":""}>${ic?I(ic):""}${text?`<span class="ql">${text}</span>`:""}</button>`;
  const quizOptChips = (e, mk, live) => `<span class="q-s">${live?`<i class="q-dot" title="The blinking structure"></i> `:""}Name it:</span><span class="q-opts">${e.shown.map((o,i)=>
    `<button class="qopt${o===mk.right?" right":""}${o===mk.wrong?" wrong":""}" data-opt="${esc(o)}"${live?"":" disabled"}><b>${OPT_LETTERS[i]}</b> ${esc(nameOf(o))}</button>`).join("")}</span>`;
  const quizPaint = note => { if(!quizEl) return;
    const ph = quiz.phase || "run", vOn = qVoiceOn(), fb = note
      ? `<span class="${note[0]}" role="status" aria-live="polite">${note[1]}</span>` : "";
    let h = "";
    if(ph==="card"){
      const n = quizPool().length;
      h = `<span class="qc-h">${I("target")} Quiz</span>`
        + `<span class="qc-row"><span class="q-s">Mode</span><span class="q-modes">${QUIZ_MODES.map(([m,l])=>`<button data-m="${m}" class="${quiz.mode===m?"on":""}">${l}</button>`).join("")}</span></span>`
        + `<span class="qc-row"><span class="q-s">Questions</span><span class="q-modes">${QUIZ_LENS.map(k=>`<button data-len="${k}" class="${quiz.total===k?"on":""}">${k||"∞"}</button>`).join("")}</span></span>`
        + `<span class="qc-scope">${I("map-pin")} ${esc(quizScope())} · ${n} structure${n===1?"":"s"}</span>`
        + (n ? "" : `<span class="q-flash-bad">No visible named structures — enable more systems</span>`)
        + `<span class="q-ctl">${qbtn("cancel","","Cancel","Cancel")}${qbtn("start","","Start the quiz","Start","pri",!n)}</span>`;
    } else if(ph==="end"){ if(quiz.view===-1){
      const done = quiz.score + quiz.tries, acc = done ? Math.round(quiz.score/done*100) : 0;
      h = `<span class="qc-h">${I("trophy")} Quiz complete</span>`
        + `<span class="qs-stats"><span><b>${quiz.score}</b>correct</span><span><b>${quiz.tries}</b>misses</span><span><b>${acc}%</b>accuracy</span><span><b>${quiz.best|0}</b>best streak</span></span>`
        + `<span class="q-ctl">${quiz.hist.length?qbtn("review","","Review the questions","Review"):""}${qbtn("retry","","Try again","Try again")}${qbtn("done","","Close the quiz","Done","pri")}</span>`; } }
    if(!h && quiz.view>=0){
      const e = quiz.hist[quiz.view], ok = e.res==="right" && !e.miss;
      const verdict = e.res==="skip" ? `<span class="q-s">Skipped</span>` : ok ? `<span class="q-flash-good">✓ Correct</span>`
        : `<span class="q-flash-bad">✖ ${e.qtype==="spot" ? "It was "+esc(nameOf(e.t)) : "Missed"}</span>`;
      h = `<span class="q-main">${e.qtype==="spot" && e.shown ? quizOptChips(e, {right:e.t, wrong:e.res==="wrong"?e.picked:null}, false)
          : `<span class="q-s">Find:</span><span class="q-t">${esc(nameOf(e.t))}</span>`}${verdict}</span>`
        + `<span class="q-bar">${qbtn("prev","skip-forward","Earlier question","","flip",quiz.view<=0)}${qbtn("next","skip-forward","Later question","")}`
        + `${qbtn("replay","rotate-ccw","Hear it again","")}<span class="q-prog">Review ${quiz.view+1}/${quiz.hist.length}</span>${qbtn("back","x",ph==="end"?"Back to the summary":"Back to the quiz","back")}</span>`;
    }
    if(!h){
      const mk = quiz.mark || {}, k = quiz.hist.length;
      h = `<span class="q-main">${quiz.qtype==="spot" && quiz.shown ? quizOptChips({shown:quiz.shown}, mk, !!quiz.opts)
          : (quiz.target ? `<span class="q-s">Find:</span><span class="q-t">${esc(nameOf(quiz.target))}</span>` : "")}${fb}</span>`
        + `<span class="q-bar">${qbtn("prev","skip-forward","Previous question","","flip",quizLast()<0)}${qbtn("skip","skip-forward","Skip this question","skip")}`
        + `<button class="q-vo${vOn?" on":""}" data-q="voice" aria-pressed="${vOn}" title="${vOn?"Mute":"Unmute"} spoken questions" aria-label="${vOn?"Mute":"Unmute"} spoken questions">${I(vOn?"volume-2":"ban")}</button>`
        + `${qbtn("replay","rotate-ccw","Hear the question again","")}<span class="q-prog">${k}${quiz.total?"/"+quiz.total:""}</span>`
        + `${quiz.scopeSys?`<span class="q-s" title="Quiz scope">${I("map-pin")} ${esc(quizScope())}</span>`:""}`
        + `<span class="q-s">✔ ${quiz.score} · ✖ ${quiz.tries}</span>${quiz.streak>1 ? `<span class="q-streak">${I("flame")}${quiz.streak}</span>` : ""}`
        + `${qbtn("quit","x","Quit the quiz","quit")}</span>`;
    }
    quizEl.innerHTML = h;
    quizEl.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",ev=>{ ev.stopPropagation(); quizAct(b.dataset.q); }));
    quizEl.querySelectorAll("[data-opt]").forEach(b=>b.addEventListener("click",ev=>{ ev.stopPropagation(); quizOpt(b.dataset.opt); }));
    quizEl.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",ev=>{ ev.stopPropagation();
      quiz.mode = b.dataset.m; try{ localStorage.setItem("atlas-qmode",quiz.mode); }catch(e){} quizPaint(); }));
    quizEl.querySelectorAll("[data-len]").forEach(b=>b.addEventListener("click",ev=>{ ev.stopPropagation();
      quiz.total = +b.dataset.len; try{ localStorage.setItem("atlas-qlen",String(quiz.total)); }catch(e){} quizPaint(); })); };
  const quizAct = a => {
    if(a==="quit"){ (quiz.score+quiz.tries>0 || quiz.hist.some(e=>e.res!==null)) ? quizEnd() : quizStop(); }
    else if(a==="done" || a==="cancel") quizStop();
    else if(a==="start" || a==="retry") quizBegin();
    else if(a==="skip"){ if(quiz.cur && quiz.cur.res===null){ if(quiz.cur.miss) srRecord(quiz.cur.t,false); quiz.cur.res = "skip"; } quizNext(); }
    else if(a==="prev") quizPrev();
    else if(a==="next") quizForward();
    else if(a==="back") quizBack();
    else if(a==="review"){ const mi = quiz.hist.findIndex(e=>e.res!=="right" || e.miss); quizReview(mi>=0 ? mi : 0); }
    else if(a==="voice"){ const on = !qVoiceOn(); setQVoice(on); sayUnlock();
      if(on){ quizPaint(); quizSpeak(); } else { sayStop(); quizPaint(); } }
    else if(a==="replay"){ sayUnlock();
      if(quiz.view>=0){ const e = quiz.hist[quiz.view];
        sayQ(e.qtype==="spot" ? `The answer was ${nameOf(e.t)}.` : `That was the ${nameOf(e.t)}.`); }
      else if(quiz.target) quizSpeak(true); } };

  /* ---- flow ---- */
  const quizAsk = (t, qt) => { quiz.target = t; quiz.last = t; quiz.qtype = qt; quiz.n++;
    quiz.cur = {t, qtype:qt, shown:null, res:null, picked:null, miss:0}; quiz.hist.push(quiz.cur);
    if(qt==="spot"){
      focusSet = new Set([t]); applyVis(); quizPulseOn(t);
      const p = partCenter(t); if(p) flyTo(p.c, p.r);
      /* distractors: visible same-system structures first, then any named part */
      const sys = sysOf(t), pool = quizPool(),
        named = Object.keys(meshes).filter(id=>byId[id] && !id.startsWith("z:"));
      const distract = shuffle(pool.filter(id=>id!==t && sysOf(id)===sys))
        .concat(shuffle(named.filter(id=>id!==t && sysOf(id)===sys && !pool.includes(id)))).slice(0,3);
      const other = shuffle(named.filter(id=>id!==t && sysOf(id)!==sys)); let i = 0;
      while(distract.length<3 && i<other.length) distract.push(other[i++]);
      quiz.opts = shuffle([t,...distract]); quiz.shown = quiz.opts; quiz.cur.shown = quiz.opts;
    }
    quizPaint(); quizSpeak(); };
  const quizNext = () => { const pool = quizPool();
    qBump(); sayStop(); quizPulseOff(true);
    quiz.view = -1; quiz.target = null; quiz.opts = null; quiz.shown = null; quiz.mark = null;
    if(focusSet){ focusSet = null; applyVis(); }   /* drop last spotlight */
    if(quiz.total && quiz.n >= quiz.total){ quizEnd(); return; }
    if(!pool.length){ quizPaint(["q-flash-bad","No visible named structures — enable more systems"]); return; }
    let t = pool[Math.floor(Math.random()*pool.length)], guard = 40;
    while(pool.length>1 && t===quiz.last && --guard) t = pool[Math.floor(Math.random()*pool.length)];
    quizAsk(t, quiz.mode==="mix" ? (Math.random()<.5 ? "tap" : "spot") : quiz.mode); };
  const quizBegin = () => { quiz.score = 0; quiz.tries = 0; quiz.streak = 0; quiz.best = 0; quiz.n = 0;
    quiz.hist = []; quiz.cur = null; quiz.view = -1; quiz.phase = "run"; quizNext(); };
  const quizEnd = () => { qBump(); sayStop(); quizPulseOff(true);
    /* an unanswered live question doesn't count; one with wrong taps counts as skipped */
    if(quiz.cur && quiz.cur.res===null){ if(quiz.cur.miss){ quiz.cur.res = "skip"; srRecord(quiz.cur.t,false); }
      else if(quiz.hist[quiz.hist.length-1]===quiz.cur){ quiz.hist.pop(); quiz.n--; } }
    quiz.phase = "end"; quiz.view = -1; quiz.target = null; quiz.opts = null; quiz.shown = null; quiz.mark = null;
    if(focusSet){ focusSet = null; applyVis(); }
    quizPaint();
    if(qVoiceOn()){ const g = quiz.gen;
      setTimeout(()=>{ if(g===quiz.gen && quizLive()) sayQ(`Quiz complete. ${quiz.score} correct, ${quiz.tries} misses.`); }, 80); } };
  const quizOpt = id => { if(!quiz.on || quiz.phase!=="run" || quiz.view!==-1 || quiz.qtype!=="spot" || !quiz.target) return;
    const t = quiz.target, right = id===t;
    quizPulseOff();   /* stop the blink; the verdict colour takes over */
    if(right){ quiz.score++; quiz.streak++; quiz.best = Math.max(quiz.best|0, quiz.streak);
      srRecord(t,true,{aided:true});   /* picking from options is recognition, not recall */
      PROG.quizRight=(PROG.quizRight|0)+1; PROG.xp=(PROG.xp|0)+10; touchStreak(); saveProg(); checkBadges();
      each(t,mm=>glow(mm,0x0f7a3d));
      quiz.mark = {right:t};
      quizPaint(["q-flash-good","✓ "+esc(nameOf(t))]); }
    else { quiz.tries++; quiz.streak=0;
      srRecord(t,false); srConfuse(t, id); saveProg();
      each(t,mm=>glow(mm,0x7a1020));
      quiz.mark = {right:t, wrong:id};
      quizPaint(["q-flash-bad","✖ It was "+esc(nameOf(t))]); }
    if(quiz.cur){ quiz.cur.res = right ? "right" : "wrong"; quiz.cur.picked = id; }
    quiz.target = null; quiz.opts = null;
    quizFeedback(right ? "Correct." : `Not quite. That was the ${nameOf(t)}.`, right?700:1500,
      ()=>{ each(t,mm=>glow(mm,0)); quizNext(); }); };
  /* a scoped quiz changes the scene — snapshot every piece of view state first
     so closing the quiz restores exactly what the learner was looking at */
  const snapScene = () => ({
    chips:{...chipOn}, peel:peelN, reg:isoRegion, iso:isolated, side:isoSide,
    hid:[...hidden], fad:[...faded], fs:focusSet?[...focusSet]:null,
    sel:selected, lbl:labelsOn, st:stOn,
    cam:camera.position.toArray(), tgt:controls.target.toArray() });
  const restoreScene = s => { if(!s) return;
    for(const k in chipOn) chipOn[k] = !!s.chips[k];
    peelN = s.peel; isoRegion = s.reg; isolated = s.iso; isoSide = s.side;
    hidden.clear(); s.hid.forEach(id=>hidden.add(id));
    faded.clear(); s.fad.forEach(id=>faded.add(id));
    focusSet = s.fs ? new Set(s.fs) : null;
    setLbl(s.st ? "mask" : (s.lbl ? "all" : "off"));
    peelSync(); applyVis(); syncHiddenBar();
    camera.position.fromArray(s.cam); controls.target.fromArray(s.tgt); controls.update();
    if(s.sel) select(s.sel); };
  const quizStop = () => { quizPulseOff(true); quiz.on=false; quiz.phase=null; quiz.target=null; quiz.opts=null; quiz.shown=null; quiz.mark=null; quiz.view=-1;
    cv.classList.remove("quizmode");
    qBump(); sayStop();
    if(document.body.contains(cv)) restoreScene(quiz.snap);   /* the exact pre-quiz scene */
    quiz.snap = null; quiz.scopeSys = null;

  const attClear = () => fxClear();

    if(tr.polyline) tr.polyline.forEach(pt=>{
      if(typeof pt === "string"){ const m = pt.match(/^([a-z0-9:-]+):([-\d.e]+),([-\d.e]+),([-\d.e]+)$/i); if(!m) return;
        const p = partCenter(m[1]); if(!p) return;

        traceStart(b.dataset.tr); })); } }

  paintPins();
  /* deep-linked part (or landmark's part): enable its system layer and
     spotlight it — otherwise #/3d/heart flies into an empty ribcage
     (skeletal-only default). Skipped for lessons/quizzes/traces/explicit
     ?sys links, which manage their own layers. */
  const dsel = selId && meshes[selId] ? selId
    : st.lm && lmById(st.lm) && meshes[lmById(st.lm).pid] ? lmById(st.lm).pid : null;
  if(dsel && !st.lesson){
    const dsys = meshes[dsel][0] && meshes[dsel][0].userData.sys;
    if(free3d && dsys!=="skeletal"){
      b3dUpsell(`${nameOf(dsel)} is part of Premium`);
    } else {
      meshes[dsel].forEach(m=>chipOn[m.userData.sys]=true);
      if(!st.sys && !st.quiz && !st.trace) focusSet = new Set([dsel]);
      applyVis(); syncHiddenBar(); } }
  select(selId && meshes[selId] && !(free3d && meshes[selId][0].userData.sys!=="skeletal") ? selId : null);
  if(selId && meshes[selId] && !(free3d && meshes[selId][0].userData.sys!=="skeletal")) focusOn(selId);
  /* feature-pack deep links */
  if(st.att && selId && !free3d) attShow(selId);
  if(st.trace && !free3d) traceStart(st.trace);

  }
  /* quiz deep link: #/3d?quiz=find|name|mix — start a quiz straight away */
  if(st.quiz) quizStart(null, {find:"tap",tap:"tap",name:"spot",spot:"spot"}[st.quiz] || "mix");

  /* one gentle conversion nudge — once per session, ~5 min into a free 3D visit */

    setTimeout(()=>{ try{ sessionStorage.setItem("atlas-3d-nudge","1"); }catch(e){}
      if(document.body.contains(cv))
        b3dUpsell("You're enjoying the explorer — unlock the full body"); }, 5*60*1000);
  }

  /* one-time tour of the region bar, layers, the fold toggle and focus mode */
  const TOUR_STEPS = [
    [".b3d-regs","Pick a body region","Tap a region to dissect just that part of the body, then add layers inside it."],
    [".b3d-rail","Add layers","Skeleton, muscles, nerves and more. A region plus a layer gives you, say, the arm's muscles."],
    ["#b3drt","Fold bars away","Tap this arrow, or swipe up on the bar, to tuck it away and see more of the body."],
    ["#b3dfocus","Focus mode","Hides every panel for a clear view. Tap Controls to bring them back."] ];
  let tourEl = null, tourCur = 0, tourOff = null;
  const tourValid = () => TOUR_STEPS.map((s,i)=>i).filter(i=>{ const t = appEl.querySelector(TOUR_STEPS[i][0]);
    if(!t) return false; const r = t.getBoundingClientRect(); return r.width>0 && r.height>0; });
  const tourEnd = done => { if(done){ try{ localStorage.setItem("atlas-tour-v1","1"); }catch(e){} }
    if(tourEl){ tourEl.remove(); tourEl = null; }
    appEl.querySelectorAll(".tour-hl").forEach(x=>x.classList.remove("tour-hl"));
    if(tourOff){ tourOff(); tourOff = null; } };
  const tourShow = i => { if(!tourEl) return;
    const v = tourValid(), j = v.find(k=>k>=i);
    if(j===undefined){ tourEnd(true); return; }
    tourCur = j;
    const [sel, title, body] = TOUR_STEPS[j], t = appEl.querySelector(sel), last = j===v[v.length-1];
    appEl.querySelectorAll(".tour-hl").forEach(x=>x.classList.remove("tour-hl")); t.classList.add("tour-hl");
    tourEl.innerHTML = `<b>${title}</b><p>${body}</p><div class="tour-ft"><span class="tour-dots">${v.map(k=>`<i class="${k===j?"on":""}"></i>`).join("")}</span>`
      + `<button data-t="skip">Skip</button><button class="pri" data-t="next">${last?"Got it":"Next"}</button></div><i class="tour-ar"></i>`;
    const ar = appEl.getBoundingClientRect(), r = t.getBoundingClientRect(), cw = tourEl.offsetWidth, ch = tourEl.offsetHeight, arw = tourEl.querySelector(".tour-ar");
    const rx = r.left - ar.left, ry = r.top - ar.top;
    let x, y, side;
    if(r.height > ar.height*0.35 && ar.width > 760){ side = "left"; x = rx + r.width + 14; y = ry + 18; }
    else if(ry < ar.height/2){ side = "up"; y = ry + r.height + 12; x = rx + r.width/2 - cw/2; }
    else { side = "down"; y = ry - ch - 12; x = rx + r.width/2 - cw/2; }
    x = Math.max(8, Math.min(ar.width - cw - 8, x)); y = Math.max(8, Math.min(ar.height - ch - 8, y));
    tourEl.style.left = x+"px"; tourEl.style.top = y+"px";
    arw.className = "tour-ar " + side;
    if(side==="left") arw.style.top = "22px";
    else arw.style.left = Math.max(14, Math.min(cw-26, rx + r.width/2 - x - 6)) + "px"; };
  const tourStart = force => { if(tourEl){ if(!force) return; tourEnd(false); }
    try{ if(!force && localStorage.getItem("atlas-tour-v1")) return; }catch(e){}
    tourEl = document.createElement("div"); tourEl.className = "b3d-tour"; tourEl.setAttribute("role","dialog"); tourEl.setAttribute("aria-label","Quick tour");
    appEl.appendChild(tourEl);
    tourEl.addEventListener("click",e=>{ const b = e.target.closest("[data-t]"); if(!b) return;
      if(b.dataset.t==="skip") { tourEnd(true); return; }

  { const tb = $("#b3dtourbtn"); if(tb) tb.addEventListener("click",()=>{ closeDrawer(); tourStart(true); }); }
  if(!st.lesson && !st.quiz && !selId)
    setTimeout(()=>{ if(document.body.contains(cv) && !quiz.on && !lesson.on && !appEl.classList.contains("sel")) tourStart(false); }, 2200);

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let raf;

      dirty = false;
      const _t0 = performance.now();
      try{ if(aoOn && composer) composer.render(); else renderer.render(scene,camera); }
      catch(err){ composer = null; aoOn = false; if(aob) aob.classList.remove("on");

     down, then drops shadows, instead of stuttering while you drag */

  addEventListener("resize",onRs);

function parseQC(s){ const c={sys:[],regs:[],mode:"mix",n:0,t:0,plate:0,path:null,ids:[]};
  s.slice(2).split("&").forEach(kv=>{ const [k,v]=kv.split("="); const val=decodeURIComponent(v||"");
    if(k==="sys") c.sys=val.split(",").filter(x=>SYSTEMS[x]);
    else if(k==="r") c.regs=val.split(",").filter(x=>REGIONS[x]);
    else if(k==="mode"&&QMODES.some(m=>m[0]===val)) c.mode=val;
    else if(k==="p"){ const p=(window.ATLAS_PATHS||[]).find(x=>x.id===val); if(p){c.path=val;c.ids=p.steps.filter(id=>byId[id]);} }
    else if(k==="n") c.n=+val||0; else if(k==="t") c.t=Math.min(600,+val||0); else if(k==="plate") c.plate=val==="1"; });
  return c; }
function cfgToHash(c){ const p=[];
  if(c.path)p.push("p="+c.path); if(c.sys.length)p.push("sys="+c.sys.join(",")); if(c.regs.length)p.push("r="+c.regs.join(","));
  if(c.mode)p.push("mode="+c.mode); if(c.n)p.push("n="+c.n); if(c.t)p.push("t="+c.t); if(c.plate)p.push("plate=1");

function quizPool(c){
  let pool = (c.ids&&c.ids.length) ? c.ids.map(id=>byId[id]).filter(d=>d&&d.summary) : DATA.filter(d=>d.summary);
  if(c.mode==="cases") pool = pool.filter(d=>TEACH[d.id] && TEACH[d.id].case);
  else if(c.mode==="facts") pool = pool.filter(d=>d.oi);
  if(c.sys.length) pool = pool.filter(d=>c.sys.includes(d.system));
  if(c.regs.length) pool = pool.filter(d=>c.regs.includes(d.region));

function qDistractors(pool, d){
  const same = pool.filter(x=>x.id!==d.id && x.system===d.system);

  const distract = shuffle(same).slice(0,3);
  while(distract.length<3 && others.length) distract.push(others.splice(Math.floor(Math.random()*others.length),1)[0]);

/* ---------- search ---------- */
let lastFuzzy = false;
function search(q){
  q = q.trim().toLowerCase(); if(!q) return [];
  const score = d => {
    const n = d.name.toLowerCase(), aka=(d.aka||"").toLowerCase(), lat=(d.latin||"").toLowerCase(), s=d.summary.toLowerCase();
    if(n===q) return 100;
    if(n.startsWith(q)) return 80;
    if(n.includes(q)) return 60;
    if(aka.includes(q)) return 45;
    if(lat && lat.includes(q)) return 44;
    if((d.tags||[]).some(t=>t.toLowerCase().includes(q))) return 35;
    if(s.includes(q)) return 15;
    if(SYSTEMS[d.system].name.toLowerCase().includes(q)) return 12;
    if(REGIONS[d.region].name.toLowerCase().includes(q)) return 12;
    return 0;
  };
  const exact = DATA.map(d=>({d,s:score(d)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.d);
  lastFuzzy = false;
  if(exact.length) return exact;
  /* fuzzy fallback: trigram similarity over name/aka/latin/tags — catches typos */
  lastFuzzy = true;
  return DATA.map(d=>{
      const hay = [d.name,d.aka||"",d.latin||"",(d.tags||[]).join(" ")].join(" ");
      return {d, s: triScore(q, hay)};
    }).filter(x=>x.s>=0.42).sort((a,b)=>b.s-a.s).slice(0,12).map(x=>x.d);
}
const si = $("#search"), sd = $("#search-drop");
si.addEventListener("input",()=>{
  const q = si.value; const res = search(q).slice(0,9);
  if(!q || !res.length){ sd.classList.add("hidden"); return; }
  sd.innerHTML = res.map(d=>`<div class="sd-item" data-id="${d.id}"><span class="n">${d.name}</span><span class="s">${SYSTEMS[d.system].name}</span></div>`).join("")
    + `<span class="sd-all" id="sdall">All results for “${esc(q)}” →</span>`;
  sd.classList.remove("hidden");
  sd.querySelectorAll(".sd-item").forEach(i=>i.addEventListener("click",()=>{ location.hash="/part/"+i.dataset.id; sd.classList.add("hidden"); si.value=""; }));
  $("#sdall").addEventListener("click",()=>{ location.hash="/search/"+encodeURIComponent(q); sd.classList.add("hidden"); });
});
si.addEventListener("keydown",e=>{
  if(e.key==="Enter"){ const q=si.value; if(q){ location.hash="/search/"+encodeURIComponent(q); sd.classList.add("hidden"); } }
  if(e.key==="Escape"){ sd.classList.add("hidden"); si.blur(); }
});

let routeN = 0;
function route(){
  routeN++;
  if(quiz.timer){ clearInterval(quiz.timer); quiz.timer=null; }
  document.body.classList.remove("b3d-open");
  const h = location.hash.replace(/^#\/?/,"").replace(/^3d\?(.*)$/,"3d/?$1");
  const [_,kind,arg] = h.match(/^([\w-]*)(?:\/(.*))?$/) || [];
  closeSidebar();
  /* free the WebGL context as soon as the user leaves the 3D view — holding it
     while browsing plates/quizzes is what pushed iOS over its memory limit */
  if(kind !== "3d" && B3D.renderer) destroyScene();
  /* ---- auth & premium gate ---- */
  document.body.classList.toggle("signed-out", !AUTH.session);
  if(!AUTH.ready){ vBoot(); return; }
  if(!AUTH.session){ if(kind==="auth") vAuth(arg); else vLanding(); return; }
  if(kind==="auth"){ location.hash = "#/"; return; }
  if(PREMIUM_KINDS.has(kind) && !AUTH.isPremium()){ vPaywall(kind); return; }
  document.querySelectorAll(".nav-link").forEach(a=>a.classList.remove("active"));
  const mark = sel => { const el=document.querySelector(`.nav-link[data-href="#/${sel}"]`);
    if(!el) return; el.classList.add("active");
    const c = el.closest(".nav-coll");
    if(c && c.classList.contains("closed")){ c.classList.remove("closed");
      const hb = c.previousElementSibling; if(hb) hb.setAttribute("aria-expanded","true"); } };
  if(!kind){ vHome(); mark(""); }
  else if(kind==="system" && SYSTEMS[arg]){ vSystem(arg); mark("system/"+arg); }
  else if(kind==="region" && REGIONS[arg]){ vRegion(arg); mark("region/"+arg); }
  else if(kind==="part" && byId[arg]){ vDetail(arg); }
  else if(kind==="map"){ vMap(); mark("map"); }
  else if(kind==="quiz"){ if(arg){ vQuiz(arg); mark(arg==="due"?"learn/review":"quiz"); } else { vQuizHub(); mark("quiz"); } }
  else if(kind==="quiz-builder"){ vQuizBuilder(); mark("quiz"); }
  else if(kind==="path" && arg){ vPath(arg); mark("paths"); }
  else if(kind==="paths"){ vPaths(); mark("paths"); }
  else if(kind==="article" && arg && ARTICLES[arg] && byId[arg]){ vArticle(arg); mark("learn"); }
  else if(kind==="articles"){ vArticles(); mark("learn"); }
  else if(kind==="learn"){ if(arg==="review"){ vReview(); mark("learn/review"); } else { vLearn(arg||null); mark("learn"); } }
  else if(kind==="gallery"){ vGallery(); mark("gallery"); }
  else if(kind==="3d"){ v3D(arg||null); mark("3d"); }
  else if(kind==="search"){ vSearch(arg||""); }
  else if(kind==="premium"){ vPremium(); }
  else if(kind==="reset"){ vReset(); }
  else { vHome(); }
  $("#view").scrollTop=0; window.scrollTo(0,0);
}

/* Supabase persists the session in localStorage and only removes it on a real
   sign-out — so its presence means "still signed in", even with no network
   (an expired token can't refresh offline, which makes getSession() return null) */
function storedSession(){
  try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i);
    if(/^sb-.+-auth-token$/.test(k)){ const s = JSON.parse(localStorage.getItem(k)); if(s && s.user && s.user.id) return s; } } }catch(e){}
  return null;
}

async function refreshEntitlement(){
  if(!AUTH.session){ AUTH.premiumUntil = null; AUTH.lastPlan = null; return; }
  const uid = AUTH.session.user.id;
  if(!supa){ const c = premCacheGet(uid); AUTH.premiumUntil = c ? c.exp : null; AUTH.lastPlan = c ? c.plan : null; return; }
  try{
    const { data, error } = await supa.from("subscriptions").select("plan,expires_at").eq("user_id", uid).order("expires_at", { ascending:false }).limit(1);
    if(error) throw error;  // network failures return error, not a throw — route them to the cache below
    const row = data && data[0];
    AUTH.premiumUntil = row ? row.expires_at : null;
    AUTH.lastPlan = row ? row.plan : null;
    premCacheSet(uid, AUTH.premiumUntil, AUTH.lastPlan);
  }catch(e){
    const c = premCacheGet(uid);
    AUTH.premiumUntil = c ? c.exp : null;
    AUTH.lastPlan = c ? c.plan : null;
  }
}

    <div class="auth-or">or with email</div>
    <form id="auth-form" novalidate>
      ${up ? `<div class="auth-f"><label for="af-name">Full name</label><input id="af-name" type="text" autocomplete="name" placeholder="Adaeze Okafor" maxlength="60"></div>` : ""}
      <div class="auth-f"><label for="af-email">Email</label><input id="af-email" type="email" autocomplete="email" placeholder="you@school.edu" required></div>
      <div class="auth-f"><label for="af-pass">Password</label><input id="af-pass" type="password" autocomplete="${up ? "new-password" : "current-password"}" placeholder="••••••••" minlength="6" required></div>
      <div id="auth-err" class="hidden"></div>
      <button class="auth-btn" id="auth-go" type="submit">${up ? "Create account" : "Sign in"}</button>
    </form>
    <div class="auth-alt">${up ? `Already have an account? <button type="button" data-go="">Sign in</button>` : `New here? <button type="button" data-go="signup">Create an account</button>`}</div>
    ${up ? "" : `<div class="auth-forgot"><button type="button" id="af-forgot">Forgot password?</button></div>`}
    <div class="auth-note">Secure sign-in by Supabase · payments by Paystack</div>
  </div></div>`;

  const gbtn = $("#ag-google");
  gbtn.addEventListener("click", async () => {
    if(EMBEDDED){ window.open(`${location.origin}${location.pathname}#/auth`, "_blank"); return; }
    if(!supa){ authErr("Auth isn't configured yet — see .env.example."); return; }
    gbtn.disabled = true;
    const { error } = await supa.auth.signInWithOAuth({ provider:"google", options:{ redirectTo: location.origin + location.pathname } });
    if(error){ authErr(error.message); gbtn.disabled = false; }
  });

  view.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    location.hash = "#/auth" + (b.dataset.go ? "/" + b.dataset.go : "");
  }));

  $("#auth-form").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("#auth-go");
    const email = $("#af-email").value.trim(), pass = $("#af-pass").value;
    const name = up ? ($("#af-name") ? $("#af-name").value.trim() : "") : "";
    if(!email || pass.length < 6){ authErr("Enter a valid email and a password of at least 6 characters."); return; }
    if(!supa){ authErr("Auth isn't configured yet — see .env.example."); return; }
    btn.disabled = true;
    try{
      if(up){
        const { data, error } = await supa.auth.signUp({ email, password: pass, options:{ data:{ full_name: name } } });
        if(error) throw error;
        if(!data.session){ vVerify(email); return; }
      } else {
        const { error } = await supa.auth.signInWithPassword({ email, password: pass });
        if(error) throw error;
      }
      location.hash = "#/";
    }catch(err){
      authErr(err.message || "Something went wrong — please try again.");
      btn.disabled = false;
    }
  });

  const fg = $("#af-forgot");
  if(fg) fg.addEventListener("click", async () => {
    const email = $("#af-email").value.trim();
    if(!email){ authErr("Enter your email first, then tap Forgot password."); return; }
    if(!supa){ authErr("Auth isn't configured yet."); return; }
    const { error } = await supa.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    authErr(error ? error.message : "Reset link sent — check your inbox.", !error);
  });
}

function vVerify(email){
  view.innerHTML = `<div class="auth-wrap"><div class="auth-card auth-ve">
    <span class="ve-ic">${I("mail")}</span>
    <h1>Check your inbox</h1>
    <p>We sent a confirmation link to <b>${esc(email)}</b>.<br>Tap it, then come back and sign in.</p>
    <div class="auth-alt"><button type="button" id="ve-back">← Back to sign in</button></div>
  </div></div>`;
  $("#ve-back").addEventListener("click", () => { location.hash = "#/auth"; });
}

function vReset(){
  crumbs([{ t:"Account" }, { t:"Reset password" }]);
  view.innerHTML = `<div class="auth-wrap"><div class="auth-card">
    <div class="auth-logo"><img src="icons/mark-256.png" alt=""><b>Anatomy Atlas</b></div>
    <h1>Set a new password</h1>
    <p class="auth-sub">Choose a new password for your account.</p>
    <form id="auth-form"><div class="auth-f"><label for="af-pass">New password</label><input id="af-pass" type="password" minlength="6" autocomplete="new-password" required></div>
    <div id="auth-err" class="hidden"></div><button class="auth-btn" type="submit">Update password</button></form>
  </div></div>`;
  $("#auth-form").addEventListener("submit", async e => {
    e.preventDefault();
    if(!supa) return;
    const { error } = await supa.auth.updateUser({ password: $("#af-pass").value });
    if(error) authErr(error.message);
    else { toast("Password updated"); location.hash = "#/"; }
  });
}

/* ---------- premium views ---------- */

let paySel = "yearly";
function planCardHTML(p, sel){
  return `<button type="button" class="plcard${p.id === sel ? " on" : ""}" data-plan="${p.id}">
    ${p.best ? `<span class="pb">Best value</span>` : ""}
    <span class="pk">${I("check")}</span>
    <span class="pn">${p.label}</span>
    <span class="pp">${naira(p.price)}</span>
    <span class="pd">${p.days} days of Premium</span>
    <span class="pn2">${p.note || ""}</span>
  </button>`;
}
function renderPlanCards(sel){
  paySel = sel;
  const host = $("#pay-plans"); if(!host) return;
  host.innerHTML = PLANS.map(p => planCardHTML(p, sel)).join("");
  const lbl = $("#pay-lbl"); if(lbl) lbl.textContent = `Pay ${naira(planOf(sel).price)} with Paystack`;
  host.querySelectorAll(".plcard").forEach(b => b.addEventListener("click", () => {
    renderPlanCards(b.dataset.plan);
  }));
}
const payBlock = () => `
  <div class="plcards" id="pay-plans"></div>
  <button class="pay-btn" id="pay-go">${I("key")} <span id="pay-lbl"></span></button>
  <div class="pay-trust">Secured by Paystack · card, bank or USSD · instant unlock · days stack</div>`;

function vPaywall(kind){
  crumbs([{ t:"Home", href:"#/" }, { t:"Premium" }]);
  const feat = FEATURE_LABEL[kind] || "This feature";
  view.innerHTML = `
  <div class="gate">
    <div class="gate-hero">
      <span class="gate-ic">${I("lock")}</span>
      <h1>${esc(feat)} is a Premium feature</h1>
      <p>One payment unlocks the full study toolkit — the atlas reference stays free forever.</p>
    </div>
    <div class="gate-list">${featChips()}</div>
    ${payBlock()}
  </div>`;
  renderPlanCards("yearly");
  $("#pay-go").addEventListener("click", () => payFor(paySel));
}

function vPremium(){
  crumbs([{ t:"Home", href:"#/" }, { t:"Premium" }]);
  const prem = AUTH.isPremium();
  const plan = AUTH.lastPlan ? planOf(AUTH.lastPlan) : null;
  const exp = AUTH.premiumUntil ? new Date(AUTH.premiumUntil) : null;
  const left = AUTH.daysLeft();
  const pct = prem && plan ? Math.min(100, Math.round(left / plan.days * 100)) : 0;
  view.innerHTML = `
  <div class="gate">
    ${prem && exp ? `
    <div class="prem-stat">
      <div class="ps-top">${I("gem")} Anatomy Atlas Premium</div>
      <div class="ps-sub">Everything unlocked — thanks for supporting the atlas</div>
      <div class="prem-bar"><i style="width:${pct}%"></i></div>
      <div class="ps-grid">
        <div class="ps-box"><span>Plan</span><b>${plan.label}</b></div>
        <div class="ps-box"><span>Days left</span><b>${left}</b></div>
        <div class="ps-box"><span>Expires</span><b>${exp.toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" })}</b></div>
      </div>
    </div>
    <h2 style="font-size:19px;margin-bottom:14px">Extend your Premium</h2>`
    : `
    <div class="gate-hero">
      <span class="gate-ic">${I("gem")}</span>
      <h1>Go Premium</h1>
      <p>Unlock the 3D explorer, guided lessons, learning paths, quizzes and spaced review — one payment, instant access.</p>
    </div>
    <div class="gate-list">${featChips()}</div>`}
    ${payBlock()}
  </div>`;
  renderPlanCards("yearly");
  $("#pay-go").addEventListener("click", () => payFor(paySel));
}

/* ---------- payment ---------- */

/* Paystack's checkout script loads on demand — most sessions never open it */
let payJs = null;
const loadPaystack = () => payJs || (payJs = new Promise((res, rej) => {
  const s = document.createElement("script");
  s.src = "https://js.paystack.co/v1/inline.js";
  s.onload = res; s.onerror = () => { payJs = null; rej(new Error("paystack load failed")); };
  document.head.appendChild(s);
}));

async function payFor(planId){
  const plan = planOf(planId);
  if(!AUTH.session || !plan) return;
  if(!supa){ toast("Payments aren't configured yet."); return; }
  try{ await loadPaystack(); }
  catch(e){ toast("Payments couldn't load — check your connection and retry."); return; }
  if(typeof PaystackPop === "undefined"){ toast("Payments couldn't load — check your connection and retry."); return; }
  const email = AUTH.session.user.email || `${AUTH.session.user.id}@atlas.app`;
  const ref = `ATLAS-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  try{
    const handler = PaystackPop.setup({
      key: PAYSTACK_PK,
      email,
      amount: plan.price * 100,
      currency: "NGN",
      ref,
      metadata: { user_id: AUTH.session.user.id, plan: plan.id, custom_fields: [] },
      callback: res => verifyPayment((res && (res.reference || res.trxref)) || ref, plan.id),
      onClose: () => {},
    });
    handler.openIframe();
  }catch(e){
    toast("Couldn't open the payment window — try again.");
  }
}

let verifyingPay = false;
async function verifyPayment(reference, planId){
  if(verifyingPay) return;
  verifyingPay = true;
  toast("Verifying your payment…");
  try{
    const r = await fetch(`${SUPA_URL}/functions/v1/verify-payment`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${AUTH.session.access_token}`, apikey: SUPA_ANON_KEY },
      body: JSON.stringify({ reference, plan: planId }),
    });
    const j = await r.json().catch(() => ({}));
    if(r.ok && j.activated){
      AUTH.premiumUntil = j.expires_at;
      AUTH.lastPlan = planId;
      premCacheSet(AUTH.session.user.id, j.expires_at, planId);
      renderAccount();
      toast("Payment confirmed — Premium unlocked");
      location.hash = "#/premium";
      route();
    } else {
      toast(j.error || "Verification failed — contact support with your payment reference.", "Premium", () => { location.hash = "#/premium"; });
    }
  }catch(e){
    toast("Payment went through but verification failed — contact support with your reference.");
  }finally{
    verifyingPay = false;
  }
}

/* ---------- sidebar account block ---------- */

function renderAccount(){
  const host = $("#side-acct"); if(!host) return;
  const u = AUTH.session && AUTH.session.user;
  if(!u){ host.innerHTML = ""; return; }
  const name = (u.user_metadata && u.user_metadata.full_name) || u.email || "?";
  const initial = (name[0] || "?").toUpperCase();
  const chip = AUTH.isPremium()
    ? `<a class="acct-chip" href="#/premium">${I("gem")} Premium · ${AUTH.daysLeft()}d left</a>`
    : `<a class="acct-chip free" href="#/premium">${I("gem")} Go Premium</a>`;
  host.innerHTML = `<div class="acct">
    <span class="acct-ava">${esc(initial)}</span>
    <div class="acct-tx"><div class="acct-mail" title="${esc(u.email || "")}">${esc(name)}</div>${chip}</div>
    <button class="acct-out" title="Sign out" aria-label="Sign out">${I("log-out")}</button>
  </div>`;
  host.querySelector(".acct-out").addEventListener("click", async () => {
    if(supa) await supa.auth.signOut();
    premCacheClear();
    AUTH.session = null; AUTH.premiumUntil = null; AUTH.lastPlan = null;
    renderAccount();
    location.hash = "#/";
    route();
  });
}

/* ---------- auth init ---------- */

async function initAuth(){
  if(!supa){ AUTH.session = storedSession(); if(AUTH.session) await refreshEntitlement(); AUTH.ready = true; renderAccount(); route(); return; }
  try{
    const { data: { session } } = await supa.auth.getSession();
    AUTH.session = session || storedSession();
  }catch(e){ AUTH.session = storedSession(); }
  if(AUTH.session) await refreshEntitlement();
  AUTH.ready = true;
  renderAccount();
  route();
  supa.auth.onAuthStateChange(async (event, session) => {
    if(!session && event !== "SIGNED_OUT") session = storedSession();
    AUTH.session = session;
    if(event === "PASSWORD_RECOVERY"){ vReset(); return; }
    if(session) await refreshEntitlement();
    else { AUTH.premiumUntil = null; AUTH.lastPlan = null; }
    renderAccount();
    route();
  });
}

initAuth();
buildNav();
route();
})();

</script>
<script>
/* ---------- PWA: service worker, install prompt, offline save, update toast ---------- */
(function(){
  if(!("serviceWorker" in navigator)) return;
  let deferredPrompt = null, modelSaved = null, swUpdating = false;

  const toast = (msg, act, fn) => {
    let t = document.getElementById("pwa-toast");
    if(!t){ t = document.createElement("div"); t.id = "pwa-toast"; t.className = "pwa-toast"; document.body.appendChild(t); }
    t.innerHTML = `<span>${msg}</span>${act ? `<button type="button">${act}</button>` : ""}`;
    t.classList.add("on");
    if(act){ t.querySelector("button").onclick = () => { t.classList.remove("on"); fn && fn(); }; }
    else setTimeout(() => t.classList.remove("on"), 4500);
  };

  /* ---- install ---- */
  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); deferredPrompt = e;
    document.body.classList.add("can-install");
    const b = document.getElementById("pwa-install"); if(b) b.classList.remove("hidden");
  });
  if(iOS && !standalone){
    const b = document.getElementById("pwa-install");
    if(b) b.classList.remove("hidden");
    document.body.classList.add("can-install");
  }
  window.atlasInstall = async () => {
    if(!deferredPrompt){
      if(iOS) toast("To install: tap Share, then “Add to Home Screen”");
      return;
    }
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.body.classList.remove("can-install");
    const b = document.getElementById("pwa-install"); if(b) b.classList.add("hidden");
  };
  document.addEventListener("click", e => {
    if(e.target.closest && e.target.closest("#pwa-install")) window.atlasInstall();
  });
  window.addEventListener("appinstalled", () => toast("Anatomy Atlas installed"));

  /* ---- save 3D body for offline ---- */
  const paintOff = p => {
    const b = document.getElementById("pwa-offline"); if(!b) return;
    if(modelSaved){ b.classList.add("done"); b.innerHTML = `${I("check")} Works fully offline`; }
    else if(p != null){ b.innerHTML = `${I("download")} Saving… ${p}%<div class="bar"><i style="width:${p}%"></i></div>`; }
    else { b.classList.remove("done"); b.innerHTML = `${I("download")} Save 3D body for offline`; }
  };
  (async () => {
    try{ modelSaved = !!(await caches.match("model.bin")); }catch(e){ modelSaved = false; }
    paintOff();
  })();
  document.addEventListener("click", async e => {
    const b = e.target.closest && e.target.closest("#pwa-offline");
    if(!b || modelSaved || b.dataset.busy) return;
    b.dataset.busy = "1";
    try{
      const r = await fetch("model.bin");          // service worker caches it en route
      if(!r.ok) throw new Error("http " + r.status);
      const total = +r.headers.get("content-length") || 20565892;
      const rd = r.body.getReader(); let got = 0;
      for(;;){ const {done, value} = await rd.read(); if(done) break; got += value.length;
        paintOff(Math.min(99, Math.round(got / total * 100))); }
      modelSaved = true; paintOff();
      toast("3D body saved — the explorer now works offline");
    }catch(err){
      delete b.dataset.busy; paintOff();
      toast("Download failed — check your connection and retry");
    }
  });

  /* ---- service worker + updates ---- */
  navigator.serviceWorker.register("sw.js").then(reg => {
    const offer = w => toast("A new version is ready", "Refresh", () => { swUpdating = true; w.postMessage({type: "SKIP_WAITING"}); });
    if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const w = reg.installing; if(!w) return;
      w.addEventListener("statechange", () => {
        if(w.state === "installed" && navigator.serviceWorker.controller) offer(w);
      });
    });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(swUpdating) location.reload();
  });
})();
</script>
